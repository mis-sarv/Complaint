function NoticeAttachment({post, onView}){
  if (!post.attachment_data) return null;
  if ((post.attachment_mime||"").startsWith("image/")) {
    return (
      <img src={post.attachment_data} alt="Notice attachment" onClick={()=>onView(post.attachment_data)}
        className="mt-2.5 w-28 h-28 rounded-lg object-cover border border-slate-300 cursor-zoom-in" />
    );
  }
  if (post.attachment_mime === "application/pdf") {
    return (
      <a href={post.attachment_data} download={post.attachment_name || "notice.pdf"} target="_blank" rel="noreferrer"
        className="mt-2.5 inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-[12.5px] text-slate-700 hover:border-slate-400 max-w-full">
        <Ico d={I.doc} className="w-4 h-4 text-rose-500 shrink-0" /><span className="truncate">{post.attachment_name || "Attachment.pdf"}</span>
      </a>
    );
  }
  return null;
}

function NoticeComposer({profile, users, toast}){
  const isAdmin = profile.role === "Admin";
  const [msg, setMsg] = useState("");
  const [att, setAtt] = useState(null);   // {data, mime, name}
  const [imgBusy, setImgBusy] = useState(false);
  const [busy, setBusy] = useState(false);
  const [audience, setAudience] = useState("all");   // "all" | "selected"
  const [picked, setPicked] = useState([]);          // user ids
  const imgRef = useRef(null), pdfRef = useRef(null);

  const togglePick = (id) => setPicked(p => p.includes(id) ? p.filter(x=>x!==id) : [...p, id]);

  const pickImage = async (file) => {
    if (!file) return;
    setImgBusy(true);
    try { const d = await compressImage(file); setAtt({data:d, mime:"image/jpeg", name:null}); }
    catch(e){ toast(e.message, true); }
    finally { setImgBusy(false); if (imgRef.current) imgRef.current.value = ""; }
  };
  const pickPdf = (file) => {
    if (!file) return;
    if (file.type !== "application/pdf") { toast("Sirf PDF file allowed hai.", true); return; }
    if (file.size > NB_MAX_PDF_BYTES) { toast("PDF 3 MB se badi hai. Chhoti file lagayein.", true); return; }
    const reader = new FileReader();
    reader.onerror = () => toast("PDF padh nahi paaye.", true);
    reader.onload = () => setAtt({data:reader.result, mime:"application/pdf", name:file.name});
    reader.readAsDataURL(file);
    if (pdfRef.current) pdfRef.current.value = "";
  };

  const post = async () => {
    if (!msg.trim() && !att) return toast("Kuch likhein ya photo/PDF lagayein.", true);
    if (isAdmin && audience === "selected" && picked.length === 0)
      return toast("Kam se kam ek user select karein, ya \"Sabko\" chunein.", true);
    setBusy(true);
    const { error } = await sb.from("notice_board").insert({
      message: msg.trim() || null,
      attachment_data: att?.data || null,
      attachment_mime: att?.mime || null,
      attachment_name: att?.name || null,
      recipient_ids: (isAdmin && audience === "selected") ? picked : null,
    });
    setBusy(false);
    if (error) return toast(friendlyError(error), true);
    setMsg(""); setAtt(null); setAudience("all"); setPicked([]);
    // No manual refresh — the Realtime INSERT event appends it for everyone the DB lets see it.
  };

  return (
    <div className="rounded-xl border border-slate-200 bg-white shadow-sm p-3.5 mb-4">
      <div className="flex items-start gap-3">
        <div className="w-9 h-9 rounded-full bg-teal-500/15 text-teal-700 grid place-items-center font-bold text-sm shrink-0">
          {profile.name.slice(0,1).toUpperCase()}
        </div>
        <textarea className={inputCls(false)+" min-h-[54px] resize-y"} value={msg}
          onChange={e=>setMsg(e.target.value)} placeholder="Notice board par kuch likhein… सूचना यहाँ लिखें" />
      </div>
      {att && (
        <div className="mt-2.5 ml-12">
          {att.mime === "application/pdf" ? (
            <div className="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-[12.5px]">
              <Ico d={I.doc} className="w-4 h-4 text-rose-500" /><span className="truncate max-w-[180px]">{att.name}</span>
              <button type="button" onClick={()=>setAtt(null)} className="ml-1 text-slate-400 hover:text-slate-700">
                <Ico d={I.x} className="w-3.5 h-3.5"/>
              </button>
            </div>
          ) : (
            <div className="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-300 bg-slate-100">
              <img src={att.data} className="w-full h-full object-cover" alt="Attachment preview" />
              <button type="button" onClick={()=>setAtt(null)}
                className="absolute top-1 right-1 w-5 h-5 rounded-full bg-slate-900/70 text-white flex items-center justify-center">
                <Ico d={I.x} className="w-3 h-3"/>
              </button>
            </div>
          )}
        </div>
      )}

      {isAdmin && (
        <div className="ml-12 mt-2.5">
          <div className="flex items-center gap-1.5 mb-2">
            <button type="button" onClick={()=>setAudience("all")}
              className={`rounded-full px-3 py-1 text-[11.5px] font-medium border ${
                audience==="all" ? "bg-teal-500 border-teal-500 text-slate-950" : "bg-white border-slate-300 text-slate-500 hover:border-slate-400"}`}>
              Sabko
            </button>
            <button type="button" onClick={()=>setAudience("selected")}
              className={`rounded-full px-3 py-1 text-[11.5px] font-medium border ${
                audience==="selected" ? "bg-teal-500 border-teal-500 text-slate-950" : "bg-white border-slate-300 text-slate-500 hover:border-slate-400"}`}>
              Specific users{picked.length>0 ? ` (${picked.length})` : ""}
            </button>
          </div>
          {audience === "selected" && (
            <div className="rounded-lg border border-slate-200 bg-slate-50 max-h-40 overflow-y-auto p-1.5 mb-1">
              {users.length === 0 ? (
                <p className="text-[12px] text-slate-500 px-2 py-1.5">Koi user nahi mila.</p>
              ) : users.map(u => (
                <label key={u.id} className="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-white cursor-pointer text-[12.5px]">
                  <input type="checkbox" checked={picked.includes(u.id)} onChange={()=>togglePick(u.id)} className="accent-teal-500" />
                  <span className="truncate">{u.name}</span>
                  <span className="text-slate-400 truncate ml-auto text-[11px]">{u.department}</span>
                </label>
              ))}
            </div>
          )}
        </div>
      )}

      <div className="flex items-center gap-2 mt-2.5 ml-12 flex-wrap">
        <Btn size="sm" variant="outline" icon={I.camera} type="button" disabled={!!att || imgBusy} onClick={()=>imgRef.current?.click()}>
          {imgBusy ? "Adding…" : "Photo"}
        </Btn>
        <Btn size="sm" variant="outline" icon={I.doc} type="button" disabled={!!att} onClick={()=>pdfRef.current?.click()}>PDF</Btn>
        <input ref={imgRef} type="file" accept="image/*" className="hidden" onChange={e=>pickImage(e.target.files?.[0])} />
        <input ref={pdfRef} type="file" accept="application/pdf" className="hidden" onChange={e=>pickPdf(e.target.files?.[0])} />
        <Btn size="sm" variant="primary" icon={I.send} className="ml-auto" onClick={post} disabled={busy}>
          {busy ? <Spinner/> : null}Post
        </Btn>
      </div>
    </div>
  );
}

function NoticeCard({post, profile, users, toast, onView}){
  const isAdmin = profile.role === "Admin";
  const isOwner = post.created_by === profile.id;
  const recipientNames = useMemo(()=>{
    if (!post.recipient_ids?.length) return null;
    const byId = Object.fromEntries(users.map(u=>[u.id,u.name]));
    return post.recipient_ids.map(id => byId[id] || "…").join(", ");
  },[post.recipient_ids, users]);
  const [busy, setBusy] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [delBusy, setDelBusy] = useState(false);

  const setStatus = async (status) => {
    setBusy(true);
    const { error } = await sb.from("notice_board").update({status}).eq("id", post.id);
    setBusy(false);
    if (error) toast(friendlyError(error), true);
  };
  const doDelete = async () => {
    setDelBusy(true);
    const { error } = await sb.from("notice_board").delete().eq("id", post.id);
    setDelBusy(false); setConfirmDel(false);
    if (error) toast(friendlyError(error), true);
  };

  const canDelete = isAdmin || (isOwner && post.status === "Open");
  const roleTone = r => r==="Admin"?"rose":r==="Maintenance"?"violet":r==="Host"?"teal":"slate";

  return (
    <div className="rounded-xl border border-slate-200 bg-white shadow-sm p-3.5">
      <div className="flex items-start gap-3">
        <div className="w-9 h-9 rounded-full bg-slate-100 text-slate-700 grid place-items-center font-bold text-sm shrink-0">
          {post.created_by_name.slice(0,1).toUpperCase()}
        </div>
        <div className="min-w-0 grow">
          <div className="flex items-center gap-2 flex-wrap">
            <p className="font-semibold text-[13.5px] truncate">{post.created_by_name}</p>
            <Badge tone={roleTone(post.created_by_role)}>{post.created_by_role}</Badge>
            {post.recipient_ids?.length ? (
              <Badge tone="violet" title={isAdmin ? recipientNames : undefined}>
                {isAdmin ? `Sirf: ${recipientNames}` : "Sirf aapke liye"}
              </Badge>
            ) : null}
            <span className="ml-auto text-[11px] text-slate-500 font-mono shrink-0">{fmtDateTime(post.created_at)}</span>
          </div>
          {post.message ? <p className="text-[13.5px] text-slate-800 whitespace-pre-wrap mt-1.5 leading-relaxed">{post.message}</p> : null}
          <NoticeAttachment post={post} onView={onView} />
          <div className="flex items-center gap-2 mt-2.5 flex-wrap">
            {post.status === "Done"
              ? <Badge tone="emerald">Done · {post.done_by_name} · {fmtDateTime(post.done_at)}</Badge>
              : <Badge tone="amber">Open</Badge>}
            {isAdmin && post.status === "Open" && (
              <Btn size="sm" variant="ok" icon={I.check} onClick={()=>setStatus("Done")} disabled={busy}>
                {busy?<Spinner/>:null}Mark done
              </Btn>
            )}
            {isAdmin && post.status === "Done" && (
              <Btn size="sm" variant="outline" onClick={()=>setStatus("Open")} disabled={busy}>
                {busy?<Spinner/>:null}Reopen
              </Btn>
            )}
            {canDelete && (
              <Btn size="sm" variant="ghost" icon={I.x} className="ml-auto" onClick={()=>setConfirmDel(true)} title="Delete" />
            )}
          </div>
        </div>
      </div>

      {confirmDel && (
        <div className="fixed inset-0 z-[70] bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4"
             onMouseDown={e=>{ if(e.target===e.currentTarget && !delBusy) setConfirmDel(false); }}>
          <div className="bg-white border border-slate-200 w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl shadow-2xl">
            <div className="px-5 py-4 border-b border-slate-200"><h3 className="font-semibold text-[15px]">Delete this notice?</h3></div>
            <div className="px-5 py-4"><p className="text-[13.5px] text-slate-700">Yeh post hamesha ke liye hat jayegi.</p></div>
            <div className="px-5 py-3.5 border-t border-slate-200 flex gap-2 justify-end">
              <Btn variant="outline" onClick={()=>setConfirmDel(false)} disabled={delBusy}>Cancel</Btn>
              <Btn variant="danger" onClick={doDelete} disabled={delBusy}>{delBusy?<Spinner/>:null}Delete</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function NoticeBoard({profile, toast, onView}){
  const [posts, setPosts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [users, setUsers] = useState([]);   // for the Admin's "specific users" picker + name badges

  const load = useCallback(async ()=>{
    setLoading(true);
    const { data, error } = await sb.from("notice_board").select("*").order("created_at", {ascending:false});
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setPosts(data || []);
  },[toast]);
  useEffect(()=>{ load(); },[load]);

  useEffect(()=>{
    if (profile.role !== "Admin") return;   // only Admin can target — no need elsewhere
    sb.from("profiles").select("id,name,department").eq("is_active", true).order("name")
      .then(({data}) => setUsers(data || []));
  },[profile.role]);

  // Live updates for everyone looking at the board — no polling, no manual refresh.
  useEffect(()=>{
    const channel = sb.channel("notice_board_live")
      .on("postgres_changes", {event:"*", schema:"public", table:"notice_board"}, payload => {
        setPosts(prev => {
          if (payload.eventType === "INSERT"){
            if (prev.some(p=>p.id===payload.new.id)) return prev;
            return [payload.new, ...prev];
          }
          if (payload.eventType === "UPDATE") return prev.map(p => p.id===payload.new.id ? payload.new : p);
          if (payload.eventType === "DELETE") return prev.filter(p => p.id !== payload.old.id);
          return prev;
        });
      })
      .subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[]);

  return (
    <div>
      <div className="mb-4">
        <h2 className="font-bold text-[17px]">Notice Board</h2>
        <p className="text-[12.5px] text-slate-500">सूचना पट्ट &mdash; real-time{profile.role==="Admin" ? " · Admin sabko ya specific users ko bhej sakta hai" : ""}</p>
      </div>

      <NoticeComposer profile={profile} users={users} toast={toast} />

      {loading ? (
        <div className="space-y-3">
          {Array.from({length:3}).map((_,i)=>(
            <div key={i} className="rounded-xl border border-slate-200 bg-white p-3.5">
              <div className="h-3 rounded bg-slate-100 animate-pulse" style={{width:`${55+i*9}%`}} />
            </div>
          ))}
        </div>
      ) : posts.length === 0 ? (
        <div className="rounded-xl border border-slate-200 bg-slate-50 px-5 py-16 text-center">
          <Ico d={I.doc} className="w-9 h-9 mx-auto text-slate-300 mb-3" />
          <p className="font-semibold text-slate-700">Abhi koi notice nahi</p>
          <p className="text-[13px] text-slate-500 mt-1">Sabse pehle aap likhein.</p>
        </div>
      ) : (
        <div className="space-y-3">
          {posts.map(p => <NoticeCard key={p.id} post={p} profile={profile} users={users} toast={toast} onView={onView} />)}
        </div>
      )}
    </div>
  );
}

const TASK_STAGES = [
  { key:"Pending Confirmation", label:"Awaiting confirmation", hi:"पुष्टि बाकी" },
  { key:"Assigned",             label:"Assigned",              hi:"सौंपा गया" },
  { key:"Completed",            label:"Completed",             hi:"पूरा हुआ" },
];

// Yellow while on track, red once the planned date has passed — only meaningful
// once a task is actually Assigned (confirmed); Pending/Completed aren't "due".
function taskUrgency(t){
  if (t.status !== "Assigned") return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const pd = new Date(t.planned_date + "T00:00:00");
  const diffDays = Math.round((pd - today) / 86400000);
  if (diffDays < 0) return { tone:"rose",  border:"#f43f5e", label:`${-diffDays} din late` };
  if (diffDays === 0) return { tone:"amber", border:"#f59e0b", label:"Aaj" };
  if (diffDays === 1) return { tone:"amber", border:"#f59e0b", label:"Kal" };
  return { tone:"amber", border:"#f59e0b", label:`${diffDays} din baad` };
}
function TaskStatusBadge({t}){
  if (t.status === "Pending Confirmation") return <Badge tone="violet">Awaiting confirmation</Badge>;
  if (t.status === "Completed") return <Badge tone="emerald">Completed</Badge>;
  const u = taskUrgency(t);
  return <Badge tone={u.tone}>{u.tone==="rose" ? `Overdue · ${u.label}` : `On track · ${u.label}`}</Badge>;
}

// Shared single-attachment picker (image, compressed, OR one PDF) — used for
// task completion proof. Mirrors the Notice Board attachment pattern.
function ProofPicker({att, setAtt, toast}){
  const [imgBusy, setImgBusy] = useState(false);
  const imgRef = useRef(null), pdfRef = useRef(null);

  const pickImage = async (file) => {
    if (!file) return;
    setImgBusy(true);
    try { const d = await compressImage(file); setAtt({data:d, mime:"image/jpeg", name:null}); }
    catch(e){ toast(e.message, true); }
    finally { setImgBusy(false); if (imgRef.current) imgRef.current.value = ""; }
  };
  const pickPdf = (file) => {
    if (!file) return;
    if (file.type !== "application/pdf") { toast("Sirf PDF file allowed hai.", true); return; }
    if (file.size > NB_MAX_PDF_BYTES) { toast("PDF 3 MB se badi hai.", true); return; }
    const reader = new FileReader();
    reader.onerror = () => toast("PDF padh nahi paaye.", true);
    reader.onload = () => setAtt({data:reader.result, mime:"application/pdf", name:file.name});
    reader.readAsDataURL(file);
    if (pdfRef.current) pdfRef.current.value = "";
  };

  return (
    <div className="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-3">
      {!att ? (
        <div className="flex gap-2 flex-wrap">
          <Btn size="sm" variant="outline" icon={I.camera} type="button" disabled={imgBusy} onClick={()=>imgRef.current?.click()}>
            {imgBusy ? "Adding…" : "Take / add photo"}
          </Btn>
          <Btn size="sm" variant="outline" icon={I.doc} type="button" onClick={()=>pdfRef.current?.click()}>Add PDF</Btn>
        </div>
      ) : att.mime === "application/pdf" ? (
        <div className="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-[12.5px]">
          <Ico d={I.doc} className="w-4 h-4 text-rose-500" /><span className="truncate max-w-[200px]">{att.name}</span>
          <button type="button" onClick={()=>setAtt(null)} className="ml-1 text-slate-400 hover:text-slate-700"><Ico d={I.x} className="w-3.5 h-3.5"/></button>
        </div>
      ) : (
        <div className="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-300 bg-white">
          <img src={att.data} className="w-full h-full object-cover" alt="Proof preview" />
          <button type="button" onClick={()=>setAtt(null)}
            className="absolute top-1 right-1 w-5 h-5 rounded-full bg-slate-900/70 text-white flex items-center justify-center">
            <Ico d={I.x} className="w-3 h-3"/>
          </button>
        </div>
      )}
      <input ref={imgRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>pickImage(e.target.files?.[0])} />
      <input ref={pdfRef} type="file" accept="application/pdf" className="hidden" onChange={e=>pickPdf(e.target.files?.[0])} />
      <p className="text-[11px] text-slate-500 mt-2.5">Photo ya PDF lagana zaroori hai — bina proof ke task complete nahi ho sakti.</p>
    </div>
  );
}

// Ring Alarm section with delivery status (online/offline, push sent, ring received)
function RingAlarmSection({t, ringMsg, setRingMsg, ringAlarm, ringBusy, ringSent}){
  const [doerStatus, setDoerStatus] = useState(null); // {online, lastSeen}
  const [reminders, setReminders] = useState([]);

  // Fetch doer's last_online_at + recent reminders for this task
  useEffect(()=>{
    let alive = true;
    (async()=>{
      const [profRes, remRes] = await Promise.all([
        sb.from("profiles").select("last_online_at").eq("id", t.assigned_to).maybeSingle(),
        sb.from("task_reminders").select("id,sent_at,acknowledged_at,received_at").eq("task_id", t.id).order("sent_at",{ascending:false}).limit(5),
      ]);
      if (!alive) return;
      if (profRes.data){
        const last = profRes.data.last_online_at;
        const online = last && (Date.now() - new Date(last).getTime()) < 90000; // 90s threshold
        setDoerStatus({online, lastSeen: last});
      }
      if (remRes.data) setReminders(remRes.data);
    })();
    return ()=>{ alive = false; };
  },[t.id, t.assigned_to, ringSent]); // re-fetch after sending ring

  // Live-update reminders when received_at or acknowledged_at changes
  useEffect(()=>{
    const ch = sb.channel(`ring_status_${t.id}`)
      .on("postgres_changes", {event:"UPDATE", schema:"public", table:"task_reminders", filter:`task_id=eq.${t.id}`},
        payload => { setReminders(prev => prev.map(r => r.id===payload.new.id ? {...r, ...payload.new} : r)); })
      .subscribe();
    return ()=>{ sb.removeChannel(ch); };
  },[t.id]);

  const fmtAgo = (iso) => {
    if (!iso) return "—";
    const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (sec < 60) return "abhi abhi";
    if (sec < 3600) return Math.floor(sec/60) + " min pehle";
    if (sec < 86400) return Math.floor(sec/3600) + " hrs pehle";
    return Math.floor(sec/86400) + " din pehle";
  };

  return (
    <div className="rounded-xl border border-amber-500/30 bg-amber-500/5 p-4 mb-4">
      <p className="text-[11px] uppercase tracking-wide text-amber-700 font-semibold mb-2 flex items-center gap-1.5">
        <Ico d={I.bell} className="w-3.5 h-3.5" /> Ring alarm — doer ke device par
      </p>

      {/* Doer status indicator */}
      <div className="flex items-center gap-3 mb-3 flex-wrap">
        <div className="flex items-center gap-1.5">
          <span className={`w-2.5 h-2.5 rounded-full ${doerStatus?.online ? "bg-emerald-500 animate-pulse" : "bg-slate-400"}`} />
          <span className="text-[12.5px] font-medium text-slate-700">
            {t.assigned_to_name}: {doerStatus?.online ? "Online" : "Offline"}
          </span>
        </div>
        {doerStatus && !doerStatus.online && doerStatus.lastSeen && (
          <span className="text-[11px] text-slate-500">Last seen: {fmtAgo(doerStatus.lastSeen)}</span>
        )}
      </div>

      <p className="text-[12px] text-slate-500 mb-2.5">
        Ring bhejne par — in-app alarm + push notification dono jaayenge. Browser band ho tab bhi push notification aayega.
      </p>

      <div className="flex items-center gap-2 flex-wrap mb-3">
        <input className={inputCls(false)+" flex-1 min-w-[160px]"} value={ringMsg}
               onChange={e=>setRingMsg(e.target.value)} placeholder="Message (optional)…" />
        <Btn size="sm" variant="primary" icon={I.bell} onClick={ringAlarm} disabled={ringBusy}>
          {ringBusy?<Spinner/>:null}{ringSent ? "Bhej diya" : "Ring alarm"}
        </Btn>
      </div>

      {/* Recent ring delivery status */}
      {reminders.length > 0 && (
        <div className="space-y-1.5">
          <p className="text-[10.5px] uppercase tracking-wide text-slate-500">Recent rings — delivery status</p>
          {reminders.map(r => (
            <div key={r.id} className="flex items-center gap-2 text-[12px] bg-white/60 rounded-lg px-3 py-1.5 flex-wrap">
              <span className="text-slate-500 shrink-0">{fmtDateTime(r.sent_at)}</span>
              <span className="flex items-center gap-1">
                <Ico d={I.send} className="w-3 h-3 text-slate-400" />
                <span className="text-slate-600">Sent</span>
              </span>
              {r.received_at ? (
                <span className="flex items-center gap-1 text-emerald-700">
                  <Ico d={I.wifi} className="w-3 h-3" />
                  <span>Device pe mila</span>
                </span>
              ) : (
                <span className="flex items-center gap-1 text-slate-400">
                  <Ico d={I.wifiOff} className="w-3 h-3" />
                  <span>Device pe abhi nahi mila</span>
                </span>
              )}
              {r.acknowledged_at ? (
                <span className="flex items-center gap-1 text-teal-700 font-semibold">
                  <Ico d={I.check} className="w-3 h-3" />
                  <span>Dekh liya</span>
                </span>
              ) : (
                <span className="flex items-center gap-1 text-amber-600">
                  <Ico d={I.clock} className="w-3 h-3" />
                  <span>Pending</span>
                </span>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TaskDetailModal({task, profile, doers, onClose, onSaved, toast}){
  const t = task;
  const isAdmin = profile.role === "Admin";
  const isDoer = t.assigned_to === profile.id;
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [newDate, setNewDate] = useState(t.planned_date);
  const [dateRemark, setDateRemark] = useState("");
  const [doerMode, setDoerMode] = useState(null); // null | "confirm" | "change"
  const [doerRemark, setDoerRemark] = useState("");
  const [note, setNote] = useState("");
  const [proof, setProof] = useState(null);
  const [confirmDel, setConfirmDel] = useState(false);
  const [delBusy, setDelBusy] = useState(false);
  const [ringMsg, setRingMsg] = useState("");
  const [ringBusy, setRingBusy] = useState(false);
  const [ringSent, setRingSent] = useState(false);

  const run = async (patch, msg) => {
    setBusy(true); setErr("");
    const { error } = await sb.from("tasks").update(patch).eq("id", t.id);
    setBusy(false);
    if (error){ setErr(friendlyError(error)); return; }
    toast(msg); onSaved(); onClose();
  };

  const updateDate = () => {
    if (!newDate) return setErr("Date chunein.");
    if (newDate === t.planned_date) return onClose();
    run({ planned_date:newDate, date_remarks: dateRemark.trim() || null },
      t.status === "Pending Confirmation" ? "Planned date update ho gayi." : `Planned date revise ho gayi (${t.revision_count+1}/3).`);
  };
  const confirmDate = () => run({ status:"Assigned", doer_remarks: doerRemark.trim() || null }, "Task confirm ho gayi — ab yeh assigned hai.");
  const requestChange = () => {
    if (!doerRemark.trim()) return setErr("Date change ki wajah likhein.");
    run({ doer_remarks: doerRemark.trim() }, "Admin ko date change ki request bhej di.");
  };
  const markDone = () => {
    if (!proof) return setErr("Photo ya document lagana zaroori hai.");
    run({ status:"Completed", proof_data:proof.data, proof_mime:proof.mime, proof_name:proof.name, completion_note: note.trim() || null },
      `Task complete mark ho gayi.`);
  };
  const doDelete = async () => {
    setDelBusy(true);
    const { error } = await sb.from("tasks").delete().eq("id", t.id);
    setDelBusy(false); setConfirmDel(false);
    if (error) return toast(friendlyError(error), true);
    toast("Task delete ho gayi."); onSaved(); onClose();
  };
  const ringAlarm = async () => {
    setRingBusy(true); setErr("");
    const { error } = await sb.from("task_reminders").insert({ task_id: t.id, message: ringMsg.trim() || null });
    setRingBusy(false);
    if (error) return setErr(friendlyError(error));
    // Also fire server-side Web Push (background notification even if browser is closed)
    sendPushToUser(t.assigned_to, t.task_desc, ringMsg.trim() || null);
    setRingMsg(""); setRingSent(true);
    toast("Reminder bhej diya + Push notification bhi.");
    setTimeout(()=>setRingSent(false), 4000);

      {isDoer && t.status === "Assigned" && (
        <div className="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-4 mb-4">

  );
}

// Both the Admin's full board and everyone's "My Tasks" view share this list
// engine — realtime-subscribed, filterable, tabbed by stage.
function TaskList({profile, doers, scope, toast, tabSeenMap, onTabSeenRefresh}){
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [stage, setStage] = useState("Assigned");
  const [q, setQ] = useState("");
  const [doerF, setDoerF] = useState("All");
  const [openTask, setOpenTask] = useState(null);
  const [showNew, setShowNew] = useState(false);

  const load = useCallback(async ()=>{
    setLoading(true);
    let query = sb.from("tasks").select("*").order("created_at", {ascending:false});
    if (scope === "mine") query = query.eq("assigned_to", profile.id);
    const { data, error } = await query;
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setTasks(data || []);
  },[toast, scope, profile.id]);
  useEffect(()=>{ load(); },[load]);

  useEffect(()=>{
    const channel = sb.channel(`tasks_live_${scope}`)
      .on("postgres_changes", {event:"*", schema:"public", table:"tasks"}, payload => {
        setTasks(prev => {
          const belongs = row => scope !== "mine" || row.assigned_to === profile.id;
          if (payload.eventType === "INSERT"){
            if (!belongs(payload.new) || prev.some(x=>x.id===payload.new.id)) return prev;
            return [payload.new, ...prev];
          }
          if (payload.eventType === "UPDATE"){
            if (!belongs(payload.new)) return prev.filter(x=>x.id!==payload.new.id);
            return prev.map(x => x.id===payload.new.id ? payload.new : x);
          }
          if (payload.eventType === "DELETE") return prev.filter(x => x.id !== payload.old.id);
          return prev;
        });
      }).subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[scope, profile.id]);

  // Keep an open detail modal in sync with live updates.
  useEffect(()=>{
    if (!openTask) return;
    const fresh = tasks.find(x=>x.id===openTask.id);
    if (fresh && fresh.updated_at !== openTask.updated_at) setOpenTask(fresh);
    if (!fresh) setOpenTask(null);
  },[tasks]);   // eslint-disable-line

  // Mark current sub-tab as seen on mount
  const switchStage = (key) => { setStage(key); markTabSeen("tasks:" + key); if (onTabSeenRefresh) onTabSeenRefresh(); };
  useEffect(() => { markTabSeen("tasks:" + stage); }, []); // eslint-disable-line

  const counts = useMemo(()=>{
    const o = {}; TASK_STAGES.forEach(s => o[s.key] = tasks.filter(t=>t.status===s.key).length); return o;
  },[tasks]);

  // Unseen count per sub-tab
  const unseenCounts = useMemo(()=>{
    const o = {};
    TASK_STAGES.forEach(s => {
      const lastSeen = tabSeenMap?.["tasks:" + s.key];
      if (!lastSeen) { o[s.key] = tasks.filter(t=>t.status===s.key).length; return; }
      o[s.key] = tasks.filter(t => t.status===s.key && t.updated_at > lastSeen).length;
    });
    return o;
  },[tasks, tabSeenMap]);

  const shown = useMemo(()=>{
    const n = q.trim().toLowerCase();
    return tasks.filter(t => {
      if (t.status !== stage) return false;
      if (doerF !== "All" && t.assigned_to !== doerF) return false;
      if (n && ![t.assigned_to_name, t.task_desc, t.assigned_by_name].join(" ").toLowerCase().includes(n)) return false;
      return true;
    }).sort((a,b) => (a.planned_date||"").localeCompare(b.planned_date||""));
  },[tasks, stage, q, doerF]);

  // Swipe to switch sub-tabs
  const stageKeys = TASK_STAGES.map(s=>s.key);
  const swipeRef = useSwipe(
    () => { const i = stageKeys.indexOf(stage); if (i < stageKeys.length-1) switchStage(stageKeys[i+1]); },
    () => { const i = stageKeys.indexOf(stage); if (i > 0) switchStage(stageKeys[i-1]); }
  );

  // Stage tab colors
  const stageColors = {
    "Pending Confirmation": { active:"bg-violet-500/15 border-violet-500/60 text-violet-800", dot:"bg-violet-500" },
    "Assigned":            { active:"bg-teal-500/15 border-teal-500/60 text-teal-800", dot:"bg-teal-500" },
    "Completed":           { active:"bg-emerald-500/15 border-emerald-500/60 text-emerald-800", dot:"bg-emerald-500" },
  };

  return (
    <div ref={swipeRef}>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <div>
          <h2 className="font-bold text-[17px]">{scope==="mine" ? "My Tasks" : "All Tasks"}</h2>
          <p className="text-[12.5px] text-slate-500">{scope==="mine" ? "आपके टास्क" : "सब टास्क — admin only"}</p>
        </div>
        {scope !== "mine" && (
          <Btn variant="primary" icon={I.plus} className="ml-auto" onClick={()=>setShowNew(true)}>Add Task</Btn>
        )}
      </div>

      <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1">
        {TASK_STAGES.map(s => {
          const sc = stageColors[s.key] || stageColors["Assigned"];
          const isActive = stage === s.key;
          const unseen = unseenCounts[s.key] || 0;
          return (
            <button key={s.key} onClick={()=>switchStage(s.key)}
              className={`shrink-0 rounded-xl px-4 py-2.5 text-left transition-all border relative ${
                isActive ? sc.active : "bg-white border-slate-200 hover:border-slate-300 text-slate-700"}`}>
              {unseen > 0 && !isActive && (
                <span className={`absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] rounded-full ${sc.dot} text-white text-[10px] font-bold flex items-center justify-center px-1 shadow-sm`}>
                  {unseen > 99 ? "99+" : unseen}
                </span>
              )}
              <span className="block text-[13px] font-semibold">
                {s.label} <span className="font-mono text-[11.5px] opacity-70">{counts[s.key]||0}</span>
              </span>
              <span className="block text-[11px] text-slate-500">{s.hi}</span>
            </button>
          );
        })}
      </div>

      <div className="flex gap-2 mb-3 flex-wrap">
        <div className="relative grow min-w-[180px]">
          <Ico d={I.search} className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input className={inputCls(false)+" pl-9"} value={q} onChange={e=>setQ(e.target.value)} placeholder="Search naam ya task…" />
        </div>
        {scope !== "mine" && (
          <select className={inputCls(false)+" w-auto"} value={doerF} onChange={e=>setDoerF(e.target.value)}>
            <option value="All">All doers</option>
            {doers.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        )}
        <Btn variant="outline" icon={I.refresh} onClick={load} aria-label="Refresh" />
      </div>

      <div className="rounded-xl border border-slate-200 bg-slate-50 overflow-hidden divide-y divide-slate-200 shadow-sm">
        {loading ? Array.from({length:4}).map((_,i)=>(
          <div key={i} className="px-4 py-4"><div className="h-3 rounded bg-slate-100 animate-pulse" style={{width:`${55+i*9}%`}} /></div>
        )) : shown.length === 0 ? (
          <div className="px-5 py-16 text-center">
            <Ico d={I.calendar} className="w-9 h-9 mx-auto text-slate-300 mb-3" />
            <p className="font-semibold text-slate-700">Yahan koi task nahi</p>
            <p className="text-[13px] text-slate-500 mt-1">
              {tasks.length ? "Filter ya search clear karke dekhein." : (scope==="mine" ? "Abhi koi task assign nahi hui." : '"Add Task" se nayi task banayein.')}
            </p>
          </div>
        ) : shown.map(t => <TaskRow key={t.id} t={t} onOpen={setOpenTask} />)}
      </div>

      {showNew && (
        <TaskFormModal profile={profile} doers={doers} toast={toast} onClose={()=>setShowNew(false)} onSaved={load} />
      )}
      {openTask && (
        <TaskDetailModal task={openTask} profile={profile} doers={doers} toast={toast}
          onClose={()=>setOpenTask(null)} onSaved={load} />
      )}
    </div>
  );
}

// ============================================================
// 13B. TASK REMINDERS — Admin "ring alarm" pings a doer's device.
//      In-tab: Sound + browser Notification fire via Realtime.
//      Background: Server-side DB trigger sends Web Push even if
//      the browser is fully closed — 100% delivery guarantee.
//      Acknowledging is mandatory so nothing silently vanishes.
// ============================================================
function BellButton({toast}){
  const [perm, setPerm] = useState(()=> (window.Notification ? Notification.permission : "unsupported"));
  if (perm === "unsupported" || perm === "granted") return null;
  const ask = async () => {
    try{
      const p = await Notification.requestPermission();
      setPerm(p);
      toast(p === "granted" ? "Reminder alerts on ho gaye." : "Alerts allow nahi hue — sirf in-app alarm bajega.");
    } catch(e){ toast("Yeh browser notifications support nahi karta.", true); }
  };
  return (
    <Btn variant="ghost" icon={I.bell} onClick={ask} className="shrink-0" title="Reminder alerts on karein">
      <span className="hidden sm:inline">Alerts</span>
    </Btn>
  );
}

function ReminderWatcher({profile}){
  const [queue, setQueue] = useState([]);
  const [busy, setBusy] = useState(false);
  const stopAlarmRef = useRef(null);
  const notifyTimerRef = useRef(null);

  // Start / stop continuous alarm based on queue
  useEffect(()=>{
    if (queue.length > 0 && !stopAlarmRef.current) {
      // Start looping alarm
      stopAlarmRef.current = playAlarm();
      // Also re-fire browser notification every 15s so it's hard to miss
      const reNotify = () => {
        const top = queue[0];
        if (top) notifyBrowser("⏰ PENDING — Task Reminder!", top.task_desc_snapshot, `task-${top.task_id}`);
      };
      notifyTimerRef.current = setInterval(reNotify, 15000);
    }
    if (queue.length === 0 && stopAlarmRef.current) {
      stopAlarmRef.current();
      stopAlarmRef.current = null;
      clearInterval(notifyTimerRef.current);
      notifyTimerRef.current = null;
    }
    return () => {
      if (stopAlarmRef.current) { stopAlarmRef.current(); stopAlarmRef.current = null; }
      if (notifyTimerRef.current) { clearInterval(notifyTimerRef.current); notifyTimerRef.current = null; }
    };
  },[queue.length]);

  // Realtime subscription
  useEffect(()=>{
    if (!profile?.id) return;
    const channel = sb.channel(`task_reminders_${profile.id}`)
      .on("postgres_changes",
        {event:"INSERT", schema:"public", table:"task_reminders", filter:`assigned_to=eq.${profile.id}`},
        payload => {
          setQueue(q => q.some(x=>x.id===payload.new.id) ? q : [...q, payload.new]);
          notifyBrowser("⏰ Task Reminder!", payload.new.task_desc_snapshot, `task-${payload.new.task_id}`);
          // Stamp received_at so Admin can see the ring reached the device
          if (!payload.new.received_at) {
            sb.from("task_reminders").update({ received_at: new Date().toISOString() }).eq("id", payload.new.id).then(()=>{});
          }
        })
      .subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[profile?.id]);

  if (!queue.length) return null;
  const r = queue[0];

  const ack = async () => {
    setBusy(true);
    await sb.from("task_reminders").update({ acknowledged_at: new Date().toISOString() }).eq("id", r.id);
    setBusy(false);
    // Drop from queue → alarm stops automatically via useEffect above
    setQueue(q => q.filter(x=>x.id!==r.id));
  };

  return (
    <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-5 border-2 border-amber-400 animate-pulse-border">
        <style>{`@keyframes pulse-border{0%,100%{border-color:#fbbf24}50%{border-color:#ef4444}} .animate-pulse-border{animation:pulse-border 1s ease-in-out infinite}`}</style>
        <div className="flex items-center gap-2 mb-2.5">
          <div className="w-9 h-9 rounded-full bg-amber-500/15 text-amber-600 grid place-items-center shrink-0">
            <Ico d={I.bell} className="w-5 h-5" />
          </div>
          <div className="min-w-0">
            <h3 className="font-bold text-[15.5px] text-slate-900">Task Reminder</h3>
            <p className="text-[11px] text-slate-500">{r.sent_by_name} · {fmtDateTime(r.sent_at)}</p>
          </div>
          <div className="ml-auto text-[11px] font-bold text-red-600 bg-red-100 px-2 py-1 rounded-full animate-pulse">
            RINGING
          </div>
        </div>
        <p className="text-[13.5px] text-slate-800 whitespace-pre-wrap leading-relaxed mb-1.5">{r.task_desc_snapshot}</p>
        <p className="text-[12px] text-slate-500 mb-2">Planned date: {fmtDate(r.planned_date_snapshot)}</p>
        {r.message ? <p className="text-[13px] text-teal-800 bg-teal-500/10 rounded-lg px-3 py-2 italic whitespace-pre-wrap mb-2">"{r.message}"</p> : null}
        {queue.length > 1 ? <p className="text-[11.5px] text-slate-400 mb-2">+{queue.length-1} aur reminder baaki</p> : null}
        <Btn variant="primary" className="w-full justify-center mt-2" onClick={ack} disabled={busy}>
          {busy?<Spinner/>:null}OK, dekh liya — Alarm band karo
        </Btn>
      </div>
    </div>
  );
}

// ============================================================
function App(){
  const [session, setSession] = useState(undefined);   // undefined = still checking
  const [profile, setProfile] = useState(null);
  const [profileErr, setProfileErr] = useState("");
  const [rows, setRows] = useState([]);
  const [machines, setMachines] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("complaints");
  const [detail, setDetail] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [toasts, setToasts] = useState([]);

  const toastSeq = useRef(0);
  const toast = useCallback((msg, bad=false)=>{
    const id = ++toastSeq.current;
    setToasts(t => [...t, {id,msg,bad}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 4200);
  },[]);
  const dismiss = useCallback(id => setToasts(t=>t.filter(x=>x.id!==id)),[]);

  // ---- auth ----
  useEffect(()=>{
    sb.auth.getSession().then(({data}) => setSession(data.session ?? null));
    const { data:{ subscription } } = sb.auth.onAuthStateChange((_e, s) => {
      setSession(s ?? null);
      if (!s){
        // Tear down EVERY view holding data. An open complaint modal that
        // survives sign-out would show the previous user's complaint to
        // whoever signs in next on the same shared factory phone.
        stopPresence();
        setProfile(null); setRows([]); setMachines([]);
        setView("complaints"); setDetail(null); setShowNew(false); setLightbox(null);
        setToasts([]);   // old toasts can name the previous user's complaints
      }
    });
    return ()=> subscription.unsubscribe();
  },[]);

  // ---- profile ----
  useEffect(()=>{
    if (!session){ setProfile(null); return; }
    let alive = true;
    sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle()
      .then(({data,error}) => {
        if (!alive) return;
        if (error) return setProfileErr(friendlyError(error));
        if (!data){ setProfileErr("Aapka profile nahi mila. Admin se sampark karein."); return; }
        if (!data.is_active){ setProfileErr("Aapka account band hai. Admin se sampark karein."); sb.auth.signOut(); return; }
        setProfile(data); setProfileErr("");
      });
    return ()=>{ alive = false; };
  },[session]);

  // ---- Web Push: register SW + subscribe on login ----
  useEffect(()=>{
    if (!profile?.id) return;
    subscribePush(profile.id);
  },[profile?.id]);

  // ---- data ----
  const loadRows = useCallback(async (showSpinner)=>{
    if (showSpinner) setLoading(true);
    // RLS decides what comes back — no role filtering is done here on purpose.
    const { data, error } = await sb.from("machine_complaints")
      .select("*, photo_count:complaint_photos(count)")
      .order("problem_date", {ascending:false}).order("created_at", {ascending:false});
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setRows((data||[]).map(r => ({...r, photo_count: r.photo_count?.[0]?.count ?? 0})));
  },[toast]);

  const loadMachines = useCallback(async ()=>{
    const { data, error } = await sb.from("machine_list").select("machine_name,machine_no,department").eq("is_active",true)
      .order("department").order("machine_name").order("machine_no");
    if (!error) setMachines(data||[]);
  },[]);

  useEffect(()=>{
    if (!profile) return;
    loadRows(true);
    loadMachines();
    const iv = setInterval(()=>{
      if (document.visibilityState === "visible" && !detail && !showNew) loadRows(false);
    }, 60000);
    return ()=> clearInterval(iv);
  },[profile, loadRows, loadMachines]);   // eslint-disable-line

  // Keep the open detail in sync with refreshed data
  useEffect(()=>{
    if (!detail) return;
    const fresh = rows.find(r => r.id === detail.id);
    if (fresh && fresh.updated_at !== detail.updated_at) setDetail(fresh);
  },[rows]);   // eslint-disable-line

  // ---- admin edge function ----
  const callAdmin = useCallback(async (payload)=>{
    try{
      const { data:{ session:s } } = await sb.auth.getSession();
      if (!s) return { ok:false, error:"Session khatam ho gaya. Dobara login karein." };
      const r = await fetch(ADMIN_FN_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${s.access_token}`, "apikey": SUPABASE_ANON },
        body: JSON.stringify(payload),
      });
      const j = await r.json().catch(()=>({}));
      if (!r.ok) return { ok:false, error: j.error || `Server error (${r.status}).` };
      return j;
    } catch(e){ return { ok:false, error: friendlyError(e) }; }
  },[]);

  // ---- render ----
  if (session === undefined) return null;      // boot overlay is still showing
  if (!session) return <><LoginScreen toast={toast} /><Toasts items={toasts} dismiss={dismiss} /></>;

  if (profileErr) return (
    <div className="min-h-screen grid place-items-center p-6 text-center">
      <div>
        <Ico d={I.alert} className="w-10 h-10 mx-auto text-rose-600 mb-3" />
        <p className="font-semibold">{profileErr}</p>
        <Btn variant="outline" className="mt-4" onClick={()=>sb.auth.signOut()}>Logout</Btn>
      </div>
    </div>
  );
  if (!profile) return <div className="min-h-screen grid place-items-center"><Spinner className="w-7 h-7 text-teal-600" /></div>;

  const scopeLine =
    profile.role === "Admin" ? "Sab complaints" :
    profile.role === "Maintenance" ? "Sab hosts ki complaints" :
    profile.role === "Host" ? `${(profile.host_types||[]).join(", ")} complaints` :
    "Sirf aapki complaints";

  // ---- Tab badge system ----
  const [tabSeenMap, reloadTabSeen] = useTabSeen(profile.id);

  // ---- Presence heartbeat ----
  useEffect(()=>{
    startPresence(profile.id);
    return ()=> stopPresence();
  },[profile.id]);

  // Mark main tab as seen on switch
  const switchView = (key) => { setView(key); markTabSeen("main:" + key); reloadTabSeen(); };
  useEffect(() => { markTabSeen("main:" + view); }, []); // eslint-disable-line

  // Unseen counts for main nav tabs
  const mainUnseenCounts = useMemo(()=>{
    const c = {};
    // Complaints: total unseen across all sub-tabs
    const compLastSeen = Math.max(
      ...(TABS.map(t => tabSeenMap["complaints:" + t.key] || "").filter(Boolean).map(d => new Date(d).getTime())),
      tabSeenMap["main:complaints"] ? new Date(tabSeenMap["main:complaints"]).getTime() : 0
    );
    c.complaints = compLastSeen > 0 ? rows.filter(r => new Date(r.updated_at).getTime() > compLastSeen).length : rows.length;
    // Notices: items updated after last notice tab seen
    const notLastSeen = tabSeenMap["main:notices"];
    c.notices = 0; // Will be computed when notices load — for now show dot if never seen
    if (!notLastSeen) c.notices = -1; // flag: show dot without number
    // Tasks: we don't have task data here but show dot if main:tasks never seen
    const taskLastSeen = tabSeenMap["main:tasks"];
    c.tasks = 0;
    if (!taskLastSeen) c.tasks = -1;
    return c;
  },[rows, tabSeenMap]);

  const navItems = [
    { key:"complaints", label:"Complaints", hi:"शिकायत", color:"bg-amber-500/15 border-amber-500/60 text-amber-800", dot:"bg-amber-500" },
    { key:"notices", label:"Notices", hi:"सूचना", color:"bg-blue-500/15 border-blue-500/60 text-blue-800", dot:"bg-blue-500" },
    { key:"tasks", label:"Tasks", hi:"कार्य", color:"bg-teal-500/15 border-teal-500/60 text-teal-800", dot:"bg-teal-500" },
    ...(profile.role === "Admin" ? [
      { key:"machines", label:"Machines", hi:"मशीन", color:"bg-purple-500/15 border-purple-500/60 text-purple-800", dot:"bg-purple-500" },
      { key:"users", label:"Users", hi:"यूजर", color:"bg-rose-500/15 border-rose-500/60 text-rose-800", dot:"bg-rose-500" },
    ] : []),
  ];

  // Swipe to switch main tabs
  const mainNavKeys = navItems.map(n=>n.key);
  const mainSwipeRef = useSwipe(
    () => { const i = mainNavKeys.indexOf(view); if (i < mainNavKeys.length-1) switchView(mainNavKeys[i+1]); },
    () => { const i = mainNavKeys.indexOf(view); if (i > 0) switchView(mainNavKeys[i-1]); }
  );

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap">
          <div className="w-9 h-9 rounded-lg bg-teal-500 text-slate-950 grid place-items-center font-extrabold text-[13px] shrink-0">MC</div>
          <div className="min-w-0 mr-auto">
            <h1 className="font-bold text-[15px] leading-tight truncate">Machine Complaint Register</h1>
            <p className="text-[11.5px] text-slate-500 truncate">{profile.name} · {profile.role} · {scopeLine}</p>
          </div>
          <Btn variant="primary" icon={I.plus} onClick={()=>setShowNew(true)} className="shrink-0">
            <span className="hidden sm:inline">New Complaint</span><span className="sm:hidden">New</span>
          </Btn>
          <BellButton toast={toast} />
          <Btn variant="ghost" icon={I.logout} onClick={()=>sb.auth.signOut()} aria-label="Logout" className="shrink-0" />
        </div>
        {/* Nav tabs — colored, with red dot badges */}
        <div className="max-w-6xl mx-auto px-4 pb-2">
          <div className="flex gap-1 overflow-x-auto pb-0.5">
            {navItems.map(n => {
              const isActive = view === n.key;
              const unseen = mainUnseenCounts[n.key] || 0;
              return (
                <button key={n.key} onClick={()=>switchView(n.key)}
                  className={`shrink-0 rounded-xl px-3 sm:px-4 py-2 text-left transition-all border relative ${
                    isActive ? n.color : "bg-white border-slate-200 hover:border-slate-300 text-slate-600"}`}>
                  {(unseen > 0 || unseen === -1) && !isActive && (
                    <span className={`absolute -top-1 -right-1 min-w-[16px] h-[16px] rounded-full ${n.dot} text-white text-[9px] font-bold flex items-center justify-center px-0.5 shadow-sm`}>
                      {unseen === -1 ? "" : (unseen > 99 ? "99+" : unseen)}
                    </span>
                  )}
                  <span className="block text-[12.5px] sm:text-[13px] font-semibold leading-tight">{n.label}</span>
                  <span className="block text-[10px] sm:text-[11px] text-slate-500 leading-tight">{n.hi}</span>
                </button>
              );
            })}
          </div>
        </div>
      </header>

      <main ref={mainSwipeRef} className="max-w-6xl mx-auto px-4 py-5">
        {view === "users" && profile.role === "Admin" ? (
          <AdminUsers profile={profile} toast={toast} callAdmin={callAdmin} />
        ) : view === "machines" && profile.role === "Admin" ? (
          <AdminMachines toast={toast} onMachinesChanged={loadMachines} />
        ) : view === "notices" ? (
          <NoticeBoard profile={profile} toast={toast} onView={setLightbox} />
        ) : view === "tasks" ? (
          <TasksPanel profile={profile} toast={toast} tabSeenMap={tabSeenMap} onTabSeenRefresh={reloadTabSeen} />
        ) : (
          <>
            <Stats rows={rows} profile={profile} />
            <ComplaintsView profile={profile} rows={rows} loading={loading}
              onRefresh={()=>loadRows(true)} onOpen={setDetail} toast={toast}
              tabSeenMap={tabSeenMap} onTabSeenRefresh={reloadTabSeen} />
          </>
        )}
      </main>

      {showNew && (
        <NewComplaintModal profile={profile} machines={machines} toast={toast} onView={setLightbox}
          onClose={()=>setShowNew(false)} onSaved={()=>{ setShowNew(false); loadRows(false); }} />
      )}
      {detail && (
        <ComplaintDetail complaint={detail} profile={profile} toast={toast} onView={setLightbox}
          onClose={()=>setDetail(null)} onSaved={()=>{ setDetail(null); loadRows(false); }} />
      )}
      {lightbox && <Lightbox src={lightbox} onClose={()=>setLightbox(null)} />}
      <ReminderWatcher profile={profile} />
      <Toasts items={toasts} dismiss={dismiss} />
    </div>
  );
}

// ============================================================
// 15. MOUNT
// ============================================================
const boot = document.getElementById("boot");
if (boot) boot.remove();
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
