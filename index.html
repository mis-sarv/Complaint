const digits = s => String(s||"").replace(/\D/g,"");
const makeUsername = n => String(n||"").trim().replace(/\s+/g," ").toLowerCase();

// The password rule, mirrored from the database's make_password().
function makePassword(mobile, dob){
  const m = digits(mobile);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dob||"")) return "";
  const [y,mo,d] = dob.split("-");
  return `${m}@${d}${mo}${y}`;
}
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

function fmtDate(s){
  if (!s) return "—";
  const p = String(s).slice(0,10).split("-");
  if (p.length !== 3) return s;
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${p[2]} ${M[+p[1]-1]} ${p[0]}`;
}
function fmtDateTime(s){
  if (!s) return "—";
  const d = new Date(s);
  if (isNaN(d)) return String(s);
  return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
// <input type="datetime-local"> needs local time, not the ISO Z string.
function toLocalInput(iso){
  const d = iso ? new Date(iso) : new Date();
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

// Turn a Supabase/Postgres error into something an operator can act on.
function friendlyError(e){
  if (!e) return "Something went wrong.";
  const m = String(e.message || e.error_description || e.error || e);
  if (/Invalid login credentials/i.test(m)) return "Wrong name or password. Dobara try karein.";
  if (/insufficient_privilege|permission denied|row-level security/i.test(m))
    return "Aapke role ko iski permission nahi hai.";
  if (/Failed to fetch|NetworkError|network/i.test(m))
    return "Internet nahi mil raha. Connection check karke dobara try karein.";
  if (/duplicate key|already exists/i.test(m)) return "Yeh entry pehle se maujood hai.";
  if (/image_size_cap/i.test(m)) return "Photo bahut badi hai. Thoda paas se photo lein.";
  if (/stage_evidence/i.test(m)) return "Is step ke liye zaroori detail missing hai.";
  if (/host_scope_matches_role/i.test(m)) return "Host ko kam se kam ek complaint type dena zaroori hai.";
  if (/mobile_is_10_digits/i.test(m)) return "Mobile number exactly 10 digit hona chahiye.";
  return m;
}

// ============================================================
// 6. PHOTO CAPTURE
//    Phone cameras emit 3-8 MB JPEGs. We downscale to 1280px and step the
//    quality down until the base64 fits the column cap, so the DB and the
//    factory's mobile data both survive.
// ============================================================
function compressImage(file){
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type||"")) return reject(new Error("Yeh image file nahi hai."));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("File padh nahi paaye."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Image open nahi hui."));
      img.onload = () => {
        try{
          const renderAt = (maxDim, q) => {
            const s = Math.min(1, maxDim / Math.max(img.width, img.height));
            const cv = document.createElement("canvas");
            cv.width = Math.max(1, Math.round(img.width*s));
            cv.height = Math.max(1, Math.round(img.height*s));
            const cx = cv.getContext("2d");
            cx.fillStyle = "#fff"; cx.fillRect(0,0,cv.width,cv.height);
            cx.drawImage(img,0,0,cv.width,cv.height);
            return cv.toDataURL("image/jpeg", q);
          };
          let q = 0.72, out = renderAt(1280, q);
          while (out.length > MAX_IMG_CHARS && q > 0.32){ q -= 0.12; out = renderAt(1280, q); }
          if (out.length > MAX_IMG_CHARS) out = renderAt(900, 0.6);
          if (out.length > MAX_IMG_CHARS) out = renderAt(700, 0.5);
          if (out.length > MAX_IMG_CHARS) return reject(new Error("Photo bahut badi hai. Paas se photo lein."));
          if (!isDataImage(out)) return reject(new Error("Photo encode nahi hui."));
          resolve(out);
        } catch(err){ reject(new Error("Is device par photo process nahi hui.")); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function PhotoCapture({photos, setPhotos, onView, toast}){
  const camRef = useRef(null), upRef = useRef(null);
  const [busy, setBusy] = useState(0);

  const handle = async (fileList) => {
    let files = Array.from(fileList || []);
    if (!files.length) return;
    const room = MAX_PHOTOS - photos.length;
    if (room <= 0) return toast(`Zyada se zyada ${MAX_PHOTOS} photo.`, true);
    if (files.length > room){ toast(`Sirf ${room} aur photo add ho sakti hai.`, true); files = files.slice(0, room); }
    setBusy(files.length);
    for (const f of files){
      try { const d = await compressImage(f); setPhotos(p => [...p, d]); }
      catch(e){ toast(e.message, true); }
      finally { setBusy(b => b-1); }
    }
    if (camRef.current) camRef.current.value = "";
    if (upRef.current) upRef.current.value = "";
  };

  return (
    <div className="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-3">
      <div className="flex gap-2 flex-wrap">
        <Btn size="sm" variant="outline" icon={I.camera} type="button" onClick={()=>camRef.current?.click()}>Take photo</Btn>
        <Btn size="sm" variant="outline" icon={I.upload} type="button" onClick={()=>upRef.current?.click()}>Upload</Btn>
      </div>
      {/* capture="environment" opens the rear camera straight away on a phone */}
      <input ref={camRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>handle(e.target.files)} />
      <input ref={upRef} type="file" accept="image/*" multiple className="hidden" onChange={e=>handle(e.target.files)} />
      {(photos.length > 0 || busy > 0) && (
        <div className="flex gap-2 flex-wrap mt-3">
          {photos.map((src,i)=>(
            <div key={i} className="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-300 bg-slate-100">
              <img src={src} alt={`Photo ${i+1}`} className="w-full h-full object-cover cursor-zoom-in" onClick={()=>onView && onView(src)} />
              <button type="button" aria-label="Remove photo"
                onClick={()=>setPhotos(p => p.filter((_,j)=>j!==i))}
                className="absolute top-1 right-1 w-5 h-5 rounded-full bg-slate-900/70 text-white flex items-center justify-center">
                <Ico d={I.x} className="w-3 h-3" />
              </button>
            </div>
          ))}
          {Array.from({length:busy}).map((_,i)=>(
            <div key={"b"+i} className="w-20 h-20 rounded-lg border border-slate-300 bg-slate-100 flex items-center justify-center">
              <Spinner className="w-4 h-4 text-slate-500" />
            </div>
          ))}
        </div>
      )}
      <p className="text-[11px] text-slate-500 mt-2.5">
        Phone par &ldquo;Take photo&rdquo; se camera khulega. {MAX_PHOTOS} tak photo, apne aap compress ho jaati hain.
      </p>
    </div>
  );
}

// ============================================================
// 7. SIGNATURE PAD
//    Dark ink on a white ground, exported as PNG, so the saved signature
//    reads the same wherever it is later displayed.
// ============================================================
const SignaturePad = React.forwardRef(function SignaturePad(props, ref){
  const canvasRef = useRef(null);
  const stateRef = useRef({ drawing:false, ink:false, last:null, ctx:null });
  const [hasInk, setHasInk] = useState(false);

  useEffect(()=>{
    const cv = canvasRef.current; if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width || 300)), h = Math.max(1, Math.round(r.height || 150));
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2.3; ctx.lineCap = "round"; ctx.lineJoin = "round";
    stateRef.current.ctx = ctx;
  },[]);

  const pos = e => {
    const r = canvasRef.current.getBoundingClientRect();
    const t = e.touches && e.touches[0];
    return { x:(e.clientX ?? t?.clientX ?? 0) - r.left, y:(e.clientY ?? t?.clientY ?? 0) - r.top };
  };
  const start = e => {
    const s = stateRef.current; if (!s.ctx) return;
    s.drawing = true; s.last = pos(e);
    if (!s.ink){ s.ink = true; setHasInk(true); }
    s.ctx.beginPath(); s.ctx.arc(s.last.x, s.last.y, 1.15, 0, Math.PI*2);
    s.ctx.fillStyle = "#0f172a"; s.ctx.fill();
    e.preventDefault?.();
  };
  const move = e => {
    const s = stateRef.current; if (!s.drawing || !s.ctx) return;
    const p = pos(e);
    s.ctx.beginPath(); s.ctx.moveTo(s.last.x, s.last.y); s.ctx.lineTo(p.x, p.y); s.ctx.stroke();
    s.last = p; e.preventDefault?.();
  };
  const end = () => { stateRef.current.drawing = false; stateRef.current.last = null; };

  React.useImperativeHandle(ref, () => ({
    hasInk: () => stateRef.current.ink,
    toDataURL: () => { try { return canvasRef.current.toDataURL("image/png"); } catch(e){ return null; } },
    clear: () => {
      const cv = canvasRef.current, s = stateRef.current; if (!cv || !s.ctx) return;
      s.ctx.save(); s.ctx.setTransform(1,0,0,1,0,0);
      s.ctx.fillStyle = "#ffffff"; s.ctx.fillRect(0,0,cv.width,cv.height); s.ctx.restore();
      s.ctx.strokeStyle = "#0f172a"; s.ctx.lineWidth = 2.3; s.ctx.lineCap="round"; s.ctx.lineJoin="round";
      s.ink = false; setHasInk(false);
    }
  }));

  return (
    <div>
      <div className="relative rounded-xl overflow-hidden border border-slate-300 bg-white">
        <canvas ref={canvasRef} className="sigpad block w-full h-[150px] cursor-crosshair"
          onPointerDown={e=>{ e.currentTarget.setPointerCapture?.(e.pointerId); start(e); }}
          onPointerMove={move} onPointerUp={end} onPointerCancel={end} onPointerLeave={end}
          onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
        {!hasInk && (
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-500 text-sm">
            Yahan ungli ya pen se signature banayein
          </div>
        )}
        <div className="absolute left-5 right-5 bottom-7 border-b border-dashed border-slate-300 pointer-events-none" />
      </div>
      <div className="flex items-center gap-2 mt-2">
        <Btn size="sm" variant="outline" type="button" onClick={()=>ref.current?.clear()}>Clear</Btn>
        <span className="ml-auto text-[11px] text-slate-500">Draw &amp; save</span>
      </div>
    </div>
  );
});

function Lightbox({src, onClose}){
  useEffect(()=>{
    const h = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", h);
    return ()=>window.removeEventListener("keydown", h);
  },[onClose]);
  return (
    // Deliberately kept dark regardless of the app's light theme — a photo
    // viewer reads best on black, and it keeps the Btn "outline" variant
    // (now styled for a white page) out of this overlay entirely.
    <div className="fixed inset-0 z-[90] bg-slate-950/95 flex items-center justify-center p-5"
         onClick={onClose}>
      <img src={src} alt="Complaint photo" className="max-w-full max-h-full rounded-xl" />
      <button onClick={onClose} type="button"
        className="absolute top-4 right-4 inline-flex items-center gap-2 rounded-lg border border-white/25 bg-white/10 hover:bg-white/20 text-white px-4 py-2.5 text-[15px] backdrop-blur-sm">
        <Ico d={I.x} className="w-4 h-4" />Close
      </button>
    </div>
  );
}

// 9. NEW COMPLAINT
//    Name and Department are NOT asked — the database stamps them from the
//    signed-in user (mc_stamp_owner), so they cannot be faked either.
// ============================================================
function NewComplaintModal({profile, machines, onClose, onSaved, toast, onView}){
  const [f, setF] = useState({
    problem_date: todayStr(),
    machine_pick: machines.length ? `${machines[0].machine_name}||${machines[0].machine_no}` : "Other",
    other_machine_name: "",
    machine_no: machines.length ? machines[0].machine_no : "",
    problem_desc: "",
    complaint_type: "Mechanical",
  });
  const [photos, setPhotos] = useState([]);
  const [errs, setErrs] = useState({});
  const [busy, setBusy] = useState(false);

  const isOther = f.machine_pick === "Other";
  const set = (k,v) => setF(s => ({...s, [k]:v}));

  const pickMachine = (val) => {
    if (val === "Other"){ setF(s=>({...s, machine_pick:"Other", machine_no:"", other_machine_name:""})); return; }
    const [nm, no] = val.split("||");
    setF(s=>({...s, machine_pick:val, machine_no:no||"", other_machine_name:""}));
  };

  const save = async () => {
    const e = {};
    if (!f.problem_date) e.problem_date = "Tareekh chunein.";
    if (!f.problem_desc || f.problem_desc.trim().length < 4) e.problem_desc = "Problem thoda detail me likhein.";
    if (isOther && !f.other_machine_name.trim()) e.other_machine_name = "Machine ka naam likhein.";
    setErrs(e);
    if (Object.keys(e).length) return;

    setBusy(true);
    const row = {
      problem_date: f.problem_date,
      machine_name: isOther ? "Other" : f.machine_pick.split("||")[0],
      machine_no: f.machine_no.trim() || null,
      other_machine_name: isOther ? f.other_machine_name.trim() : null,
      problem_desc: f.problem_desc.trim(),
      complaint_type: f.complaint_type,
      // entered_by / department / status / raised_by_user_id are set by the DB.
      entered_by: profile.name, department: profile.department,
    };
    const { data, error } = await sb.from("machine_complaints").insert(row).select("id, complaint_no").single();
    if (error){ setBusy(false); return toast(friendlyError(error), true); }

    let photoOk = true;
    if (photos.length){
      const { error: pErr } = await sb.from("complaint_photos")
        .insert(photos.map(p => ({ complaint_id: data.id, image_data: p, mime: "image/jpeg" })));
      if (pErr) photoOk = false;
    }
    setBusy(false);
    toast(`Complaint ${data.complaint_no} log ho gayi.${photos.length && photoOk ? ` ${photos.length} photo ke saath.` : ""}`);
    if (!photoOk) toast("Complaint save hui, par photo upload nahi hui. Complaint kholkar dobara add karein.", true);
    onSaved();
  };

  return (
    <Modal title="New Machine Complaint" subtitle="नई मशीन शिकायत" onClose={onClose}
      footer={<>
        <Btn variant="outline" onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" onClick={save} disabled={busy}>{busy ? <Spinner/> : null}{busy?"Saving…":"Log complaint"}</Btn>
      </>}>

      {/* Auto-picked identity — shown, not editable */}
      <div className="rounded-xl bg-slate-100 border border-slate-200 px-3.5 py-3 mb-4 flex items-center gap-3">
        <div className="w-9 h-9 rounded-full bg-teal-500/15 text-teal-700 grid place-items-center font-bold text-sm shrink-0">
          {profile.name.slice(0,1).toUpperCase()}
        </div>
        <div className="min-w-0">
          <p className="text-sm font-semibold truncate">{profile.name}</p>
          <p className="text-[11.5px] text-slate-500 truncate">{profile.department} · {profile.designation}</p>
        </div>
        <span className="ml-auto text-[10px] uppercase tracking-wide text-slate-500 shrink-0">Auto</span>
      </div>

      <Field label="Date of problem" hindi="तारीख" required error={errs.problem_date}>
        <input type="date" className={inputCls(errs.problem_date)} value={f.problem_date} max={todayStr()}
               onChange={e=>set("problem_date", e.target.value)} />
      </Field>

      <Field label="Machine" hindi="मशीन का नाम" required>
        <select className={inputCls(false)} value={f.machine_pick} onChange={e=>pickMachine(e.target.value)}>
          {machines.map(m => (
            <option key={m.machine_name+m.machine_no} value={`${m.machine_name}||${m.machine_no}`}>
              {m.machine_no} — {m.machine_name}
            </option>
          ))}
          <option value="Other">Other / list me nahi hai</option>
        </select>
      </Field>

      <div className="grid sm:grid-cols-2 gap-x-3">
        {isOther && (
          <Field label="Machine name" hindi="मशीन का नाम लिखें" required error={errs.other_machine_name}>
            <input className={inputCls(errs.other_machine_name)} value={f.other_machine_name}
                   onChange={e=>set("other_machine_name", e.target.value)} placeholder="Machine ka naam" />
          </Field>
        )}
        <Field label="Machine no" hindi="मशीन नंबर">
          <input className={inputCls(false)} value={f.machine_no}
                 onChange={e=>set("machine_no", e.target.value)} placeholder="e.g. KM-04" />
        </Field>
      </div>

      <Field label="Describe problem" hindi="शिकायत का विवरण" required error={errs.problem_desc}>
        <textarea className={inputCls(errs.problem_desc)+" min-h-[90px] resize-y"} value={f.problem_desc}
                  onChange={e=>set("problem_desc", e.target.value)}
                  placeholder="Kya problem hai, kab se hai, kaunsa part…" />
      </Field>

      <Field label="Complaint type" hindi="शिकायत का प्रकार" required>
        <select className={inputCls(false)} value={f.complaint_type} onChange={e=>set("complaint_type", e.target.value)}>
          {COMPLAINT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
        </select>
      </Field>

      <Field label="Photo" hindi="शिकायत की फोटो">
        <PhotoCapture photos={photos} setPhotos={setPhotos} toast={toast} onView={onView} />
      </Field>
    </Modal>
  );
}

// 10. COMPLAINT DETAIL — the action panel changes with your role
// ============================================================
function ComplaintDetail({complaint, profile, onClose, onSaved, toast, onView}){
  const c = complaint;
  const [photos, setPhotos] = useState(null);      // null = loading
  const [newPhotos, setNewPhotos] = useState([]);
  const [sigImage, setSigImage] = useState(undefined);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const sigRef = useRef(null);
  const [reSign, setReSign] = useState(false);

  const [eta, setEta] = useState(toLocalInput(c.expected_completion || new Date(Date.now()+4*3600e3).toISOString()));
  const [remarks, setRemarks] = useState(c.remarks || "");
  const [sigName, setSigName] = useState(c.signature || profile.name);
  const [fbRemarks, setFbRemarks] = useState("");

  const [confirmDel, setConfirmDel] = useState(false);
  const [delBusy, setDelBusy] = useState(false);

  const isOwner = c.raised_by_user_id === profile.id;
  const isHostHere = (profile.role === "Admin") ||
    ((profile.role === "Host" || profile.role === "Maintenance") &&
      (profile.role === "Maintenance" || (profile.host_types||[]).includes(c.complaint_type)));
  const canHostAct = isHostHere && profile.role !== "User";
  // Admin can delete any complaint. The raiser can delete their own only
  // while it is still Pending — once a Host has started work (In Progress),
  // deleting it would erase evidence of time already spent; the DB's
  // mc_delete_owner_pending RLS policy enforces this exact rule too, so a
  // direct API call can't bypass it even if this button were hidden/faked.
  const canDelete = profile.role === "Admin" || (isOwner && c.status === "Pending");

  useEffect(()=>{
    let alive = true;
    sb.from("complaint_photos").select("id,image_data").eq("complaint_id", c.id).order("created_at")
      .then(({data,error}) => { if(alive) setPhotos(error ? [] : (data||[])); });
    sb.from("machine_complaints").select("signature_image").eq("id", c.id).maybeSingle()
      // Coalesce to null, never undefined — undefined is the "still loading"
      // state, so a row that comes back without the column would spin forever.
      .then(({data}) => { if(alive) setSigImage(data?.signature_image ?? null); });
    return ()=>{ alive = false; };
  },[c.id]);

  const savePhotos = async () => {
    if (!newPhotos.length) return true;
    const { error } = await sb.from("complaint_photos")
      .insert(newPhotos.map(p => ({ complaint_id: c.id, image_data: p, mime:"image/jpeg" })));
    if (error){ toast("Photo upload nahi hui.", true); return false; }
    return true;
  };

  const run = async (patch, successMsg) => {
    setBusy(true); setErr("");
    await savePhotos();
    const { error } = await sb.from("machine_complaints").update(patch).eq("id", c.id);
    setBusy(false);
    if (error){ setErr(friendlyError(error)); return; }
    toast(successMsg);
    onSaved();
  };

  // --- Host: commit a completion date & time -> In Progress
  const startWork = () => {
    if (!eta) return setErr("Completion date & time chunein.");
    const when = new Date(eta);
    if (isNaN(when)) return setErr("Date & time sahi nahi hai.");
    run({ status:"In Progress", expected_completion: when.toISOString(),
          host_user_id: profile.id, remarks: remarks.trim() || null },
        `${c.complaint_no} in-progress. User ko time dikh jayega.`);
  };

  // --- Host: sign off -> Completed (waits for the raiser's confirmation)
  const markCompleted = () => {
    const drawn = sigRef.current?.hasInk() ? sigRef.current.toDataURL() : null;
    const existing = isDataImage(sigImage) && !reSign ? sigImage : null;
    if (!drawn && !existing) return setErr("Pad me signature banana zaroori hai.");
    const patch = { status:"Completed", remarks: remarks.trim() || null, signature: sigName.trim() || profile.name };
    if (drawn) patch.signature_image = drawn;
    run(patch, `${c.complaint_no} completed. Ab user confirm karega.`);
  };

  // --- Raiser: confirm the fix -> Closed, or kick it back
  const confirmFixed = () =>
    run({ status:"Closed", feedback_resolved:true, feedback_remarks: fbRemarks.trim() || null },
        `${c.complaint_no} close ho gayi. Shukriya!`);
  const notFixed = () =>
    run({ status:"In Progress", feedback_resolved:false, feedback_remarks: fbRemarks.trim() || null },
        `${c.complaint_no} wapas host ke paas bhej di.`);

  // --- Owner (Pending only) or Admin (any status): delete permanently
  const doDelete = async () => {
    setDelBusy(true);
    const { error } = await sb.from("machine_complaints").delete().eq("id", c.id);
    setDelBusy(false);
    setConfirmDel(false);
    if (error){ toast(friendlyError(error), true); return; }
    toast(`${c.complaint_no} delete ho gayi.`);
    onSaved();
  };

  const Row = ({k, v}) => (
    <div className="min-w-0">
      <p className="text-[10.5px] uppercase tracking-wide text-slate-500">{k}</p>
      <p className="text-[13.5px] text-slate-800 break-words">{v}</p>
    </div>
  );

  return (
    <Modal title={c.complaint_no} subtitle={`${c.machine_no || "—"} · ${fmtDate(c.problem_date)}`} onClose={onClose} wide
      footer={
        <>
          {canDelete &&
            <Btn variant="danger" icon={I.x} className="mr-auto" onClick={()=>setConfirmDel(true)} disabled={busy}>Delete</Btn>}
          <Btn variant="outline" onClick={onClose}>Close</Btn>
          {canHostAct && c.status === "Pending" &&
            <Btn variant="primary" onClick={startWork} disabled={busy}>{busy?<Spinner/>:null}Save &amp; start work</Btn>}
          {canHostAct && c.status === "In Progress" &&
            <Btn variant="ok" onClick={markCompleted} disabled={busy}>{busy?<Spinner/>:null}Mark completed</Btn>}
          {isOwner && c.status === "Completed" && <>
            <Btn variant="outline" onClick={notFixed} disabled={busy}>No, abhi bhi problem hai</Btn>
            <Btn variant="ok" onClick={confirmFixed} disabled={busy}>{busy?<Spinner/>:null}Yes, theek ho gaya</Btn>
          </>}
        </>
      }>

      <div className="flex items-center gap-2 flex-wrap mb-4">
        <StatusBadge c={c} />
        <Badge tone="slate">{c.complaint_type}</Badge>
        <Badge tone="slate">{c.department}</Badge>
      </div>

      <div className="grid grid-cols-2 gap-4 mb-4">
        <Row k="Machine / मशीन" v={<><span className="font-semibold">{machineLabel(c)}</span>{c.machine_no ? ` · ${c.machine_no}` : ""}</>} />
        <Row k="Reported by" v={c.entered_by} />
      </div>

      <div className="mb-4">
        <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-1.5">Problem / विवरण</p>
        <p className="rounded-lg bg-slate-100 px-3.5 py-3 text-[13.5px] whitespace-pre-wrap leading-relaxed">{c.problem_desc}</p>
      </div>

      {/* Timeline of what has actually happened */}
      <div className="rounded-xl border border-slate-200 divide-y divide-slate-200 mb-4">
        <div className="flex items-center gap-2.5 px-3.5 py-2.5 text-[12.5px]">
          <Ico d={I.clipboard} className="w-4 h-4 text-slate-500 shrink-0" />
          <span className="text-slate-500">Logged</span>
          <span className="ml-auto text-slate-700">{fmtDateTime(c.created_at)}</span>
        </div>
        {c.expected_completion && (
          <div className="flex items-center gap-2.5 px-3.5 py-2.5 text-[12.5px]">
            <Ico d={I.clock} className="w-4 h-4 text-teal-600 shrink-0" />
            <span className="text-slate-500">Completion promised</span>
            <span className="ml-auto text-teal-700 font-semibold">{fmtDateTime(c.expected_completion)}</span>
          </div>
        )}
        {c.completed_at && (
          <div className="flex items-center gap-2.5 px-3.5 py-2.5 text-[12.5px]">

            <span className="ml-auto text-slate-700">{fmtDateTime(c.completed_at)}</span>
          </div>
        )}
        {c.closed_at && (
          <div className="flex items-center gap-2.5 px-3.5 py-2.5 text-[12.5px]">

      {c.remarks ? (
        <div className="mb-4">
          <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-1.5">Host remarks</p>

      {/* Photos */}
      <div className="mb-4">

         photos.length === 0 ? <p className="text-[12.5px] text-slate-500 mb-2">Koi photo nahi.</p> :
         <div className="flex gap-2 flex-wrap mb-2">
           {photos.map((p,i)=>(
             <img key={p.id} src={p.image_data} alt={`Photo ${i+1}`} onClick={()=>onView(p.image_data)}
                  className="w-20 h-20 rounded-lg object-cover border border-slate-300 cursor-zoom-in" />
           ))}
         </div>}
        {c.status !== "Closed" && (isOwner || canHostAct) && (
          <PhotoCapture photos={newPhotos} setPhotos={setNewPhotos} toast={toast} onView={onView} />
        )}
      </div>

      {/* ---------- HOST ACTION PANEL ---------- */}
      {canHostAct && c.status === "Pending" && (
        <div className="rounded-xl border border-teal-500/30 bg-teal-500/5 p-4 mt-5">

          <Field label="Completion date &amp; time" hindi="कब तक ठीक होगा" required

                    <img src={sigImage} alt="Saved signature" className="w-full max-h-[110px] object-contain" />
                  </div>
                  <Btn size="sm" variant="outline" icon={I.pen} className="mt-2" onClick={()=>setReSign(true)}>Sign again</Btn>
                </div>
              ) : <SignaturePad ref={sigRef} />}
          </Field>
        </div>
      )}

      {/* ---------- USER FEEDBACK PANEL ---------- */}
      {isOwner && c.status === "Completed" && (
        <div className="rounded-xl border border-violet-500/30 bg-violet-500/5 p-4 mt-5">
          <p className="text-[13px] font-semibold text-violet-800 mb-1">Complaint resolved? / शिकायत ठीक हुई?</p>
          <p className="text-[12.5px] text-slate-500 mb-3">
            Host ne complaint complete mark kar di hai. Machine sach me theek ho gayi?
            &ldquo;Yes&rdquo; karne par complaint close ho jayegi.
          </p>
          <Field label="Your remarks" hindi="आपकी टिप्पणी">
            <textarea className={inputCls(false)+" min-h-[60px] resize-y"} value={fbRemarks}
                      onChange={e=>setFbRemarks(e.target.value)} placeholder="Optional" />
          </Field>
        </div>
      )}

      {isOwner && c.status === "In Progress" && c.expected_completion && (
        <div className="rounded-xl border border-teal-500/30 bg-teal-500/5 p-4 mt-5 flex items-start gap-3">
          <Ico d={I.clock} className="w-5 h-5 text-teal-700 mt-0.5 shrink-0" />
          <div>
            <p className="text-[13px] font-semibold text-teal-800">Host ne time diya hai</p>
            <p className="text-[13px] text-slate-700 mt-0.5">{fmtDateTime(c.expected_completion)} tak theek hone ki ummeed hai.</p>
          </div>
        </div>
      )}

      {err ? (
        <div className="flex items-start gap-2 rounded-lg bg-rose-500/10 text-rose-700 px-3 py-2.5 text-[13px] mt-4">
          <Ico d={I.alert} className="w-4 h-4 mt-0.5 shrink-0" /><span>{err}</span>
        </div>
      ) : null}

      {confirmDel && (
        // A plain inline overlay, not the shared <Modal> — nesting <Modal>
        // inside <Modal> would double-toggle document.body's scroll lock,
        // so cancelling this dialog would un-lock scroll while the
        // complaint detail modal underneath is still open.
        <div className="fixed inset-0 z-[70] bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4"
             onMouseDown={e=>{ if(e.target===e.currentTarget && !delBusy) setConfirmDel(false); }}>
          <div className="bg-white border border-slate-200 w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl shadow-2xl">
            <div className="px-5 py-4 border-b border-slate-200">
              <h3 className="font-semibold text-[15px]">Delete complaint?</h3>
              <p className="text-xs text-slate-500 mt-0.5">{c.complaint_no}</p>
            </div>
            <div className="px-5 py-4">
              <p className="text-[13.5px] text-slate-700">
                <strong>{c.complaint_no}</strong> hamesha ke liye delete ho jayegi &mdash; iske saath sab photo aur
                signature bhi mit jayenge. Yeh wapas nahi ho sakta.
              </p>
            </div>
            <div className="px-5 py-3.5 border-t border-slate-200 flex gap-2 justify-end">
              <Btn variant="outline" onClick={()=>setConfirmDel(false)} disabled={delBusy}>Cancel</Btn>
              <Btn variant="danger" onClick={doDelete} disabled={delBusy}>{delBusy?<Spinner/>:null}Delete permanently</Btn>
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
}

function ComplaintRow({c, profile, onOpen}){
  const needsMe =
    (c.status === "Completed" && c.raised_by_user_id === profile.id) ||
    (c.status === "Pending" && profile.role !== "User");
  return (
    <button onClick={()=>onOpen(c)}
      className="w-full text-left px-4 py-3.5 hover:bg-slate-100 transition-colors border-l-2 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4"
      style={{borderLeftColor: c.status==="Closed" ? "#10b981" : isDown(c) ? "#f43f5e" : c.status==="In Progress" ? "#14b8a6" : c.status==="Completed" ? "#a78bfa" : "#f59e0b"}}>
      <div className="sm:w-24 shrink-0">
        <p className="font-mono text-[11.5px] text-slate-500">{c.complaint_no}</p>
        <p className="font-mono text-[12px] text-slate-500">{fmtDate(c.problem_date)}</p>
      </div>
      <div className="sm:w-32 shrink-0 min-w-0">
        <p className="font-semibold text-[13px] truncate">{c.machine_no || "—"}</p>
        <p className="text-[11.5px] text-slate-500 truncate">{machineLabel(c)}</p>
      </div>
      <div className="grow min-w-0">
        <p className="text-[13px] text-slate-700 truncate">{c.problem_desc}</p>
        <p className="text-[11.5px] text-slate-500 truncate">
          {c.entered_by} · {c.complaint_type}
          {c.photo_count > 0 ? <span className="ml-1.5">📷 {c.photo_count}</span> : null}
        </p>
      </div>
      {c.status === "In Progress" && c.expected_completion ? (
        <div className="sm:w-40 shrink-0">
          <p className="text-[10.5px] uppercase tracking-wide text-slate-500">Completion by</p>
          <p className="text-[12.5px] text-teal-700 font-semibold">{fmtDateTime(c.expected_completion)}</p>
        </div>
      ) : null}
      <div className="shrink-0 flex items-center gap-2">
        {needsMe ? <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse" title="Needs your action" /> : null}
        <StatusBadge c={c} />
      </div>
    </button>
  );
}

function ComplaintsView({profile, rows, loading, onRefresh, onOpen, toast}){
  const [tab, setTab] = useState("Pending");
  const [q, setQ] = useState("");
  const [type, setType] = useState("All");

  const counts = useMemo(()=>{
    const o = {};
    TABS.forEach(t => o[t.key] = rows.filter(r => t.statuses.includes(r.status)).length);
    return o;
  },[rows]);

  const shown = useMemo(()=>{
    const tabDef = TABS.find(t => t.key === tab);
    const needle = q.trim().toLowerCase();
    return rows.filter(r => {
      if (!tabDef.statuses.includes(r.status)) return false;
      if (type !== "All" && r.complaint_type !== type) return false;
      if (needle){
        const hay = [r.complaint_no, r.entered_by, machineLabel(r), r.machine_no, r.problem_desc, r.complaint_type]
          .join(" ").toLowerCase();
        if (!hay.includes(needle)) return false;
      }
      return true;
    });
  },[rows, tab, q, type]);

  return (
    <div>
      {/* Tabs */}
      <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1">
        {TABS.map(t => (
          <button key={t.key} onClick={()=>setTab(t.key)}
            className={`shrink-0 rounded-xl px-4 py-2.5 text-left transition-colors border ${
              tab===t.key ? "bg-teal-500/15 border-teal-500/50" : "bg-white border-slate-200 hover:border-slate-300"}`}>
            <span className={`block text-[13px] font-semibold ${tab===t.key?"text-teal-800":"text-slate-700"}`}>
              {t.label} <span className="font-mono text-[11.5px] opacity-70">{counts[t.key]}</span>
            </span>
            <span className="block text-[11px] text-slate-500">{t.hi}</span>
          </button>
        ))}
      </div>

      {/* Filters */}
      <div className="flex gap-2 mb-3 flex-wrap">
        <div className="relative grow min-w-[180px]">
          <Ico d={I.search} className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input className={inputCls(false)+" pl-9"} value={q} onChange={e=>setQ(e.target.value)}
                 placeholder="Search machine no, problem, naam…" />
        </div>
        <select className={inputCls(false)+" w-auto"} value={type} onChange={e=>setType(e.target.value)}>
          <option value="All">All types</option>
          {COMPLAINT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
        <Btn variant="outline" icon={I.refresh} onClick={onRefresh} aria-label="Refresh" />
      </div>

      {/* List */}
      <div className="rounded-xl border border-slate-200 bg-slate-50 overflow-hidden divide-y divide-slate-200 shadow-sm">
        {loading ? (
          Array.from({length:4}).map((_,i)=>(
            <div key={i} className="px-4 py-4"><div className="h-3 rounded bg-slate-100 animate-pulse" style={{width:`${55+i*9}%`}} /></div>
          ))
        ) : shown.length === 0 ? (
          <div className="px-5 py-16 text-center">
            <Ico d={I.clipboard} className="w-9 h-9 mx-auto text-slate-300 mb-3" />
            <p className="font-semibold text-slate-700">
              {tab === "Pending" ? "Koi pending complaint nahi" : tab === "In Progress" ? "Kuch chal nahi raha" : "Abhi kuch complete nahi hua"}
            </p>
            <p className="text-[13px] text-slate-500 mt-1">
              {rows.length ? "Filter ya search clear karke dekhein." : "Nayi complaint “New Complaint” se log karein."}
            </p>
          </div>
        ) : shown.map(c => <ComplaintRow key={c.id} c={c} profile={profile} onOpen={onOpen} />)}
      </div>
    </div>
  );
}

function UserFormModal({editing, onClose, onSaved, toast, callAdmin}){
  const isEdit = !!editing;
  const [f, setF] = useState({
    name: editing?.name || "", mobile: editing?.mobile || "",
    department: editing?.department || DEPARTMENTS[0],
    designation: editing?.designation || "",
    dob: editing?.dob || "", role: editing?.role || "User",
    host_types: editing?.host_types || [],
  });
  const [errs, setErrs] = useState({});
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const set = (k,v) => setF(s => ({...s, [k]:v}));

  const preview = useMemo(()=>({
    username: makeUsername(f.name),
    password: makePassword(f.mobile, f.dob),
  }),[f.name, f.mobile, f.dob]);

  const toggleType = (t) =>
    set("host_types", f.host_types.includes(t) ? f.host_types.filter(x=>x!==t) : [...f.host_types, t]);

  const save = async () => {
    const e = {};
    if (f.name.trim().length < 2) e.name = "Poora naam likhein.";
    if (!/^\d{10}$/.test(digits(f.mobile))) e.mobile = "Exactly 10 digit ka mobile number.";
    if (!f.designation.trim()) e.designation = "Designation likhein.";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.dob)) e.dob = "Janm tithi chunein.";
    if (f.role === "Host" && f.host_types.length === 0) e.host_types = "Host ko kam se kam ek complaint type dein.";
    setErrs(e);
    if (Object.keys(e).length) return;

    setBusy(true);
    const payload = {
      action: isEdit ? "update" : "create",
      id: editing?.id,
      name: f.name.trim(), mobile: digits(f.mobile),
      department: f.department, designation: f.designation.trim(),
      dob: f.dob, role: f.role,
      host_types: f.role === "Host" ? f.host_types : [],
    };
    const res = await callAdmin(payload);
    setBusy(false);
    if (!res.ok) return toast(res.error, true);
    setResult(res);       // show the credentials so the admin can hand them over
    onSaved();
  };

  if (result){
    return (
      <Modal title={isEdit ? "User updated" : "User created"} subtitle={f.name} onClose={onClose}
        footer={<Btn variant="primary" onClick={onClose}>Done</Btn>}>
        <div className="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-4">
          <p className="text-[13px] text-emerald-800 font-semibold mb-3">
            {isEdit && !result.password_changed ? "Details update ho gayi. Password wahi hai." : "Yeh login details user ko dein:"}
          </p>
          <div className="space-y-2.5 font-mono text-[13.5px]">
            <div className="flex gap-3"><span className="text-slate-500 w-20 shrink-0">Name</span><span className="text-slate-900 break-all">{f.name}</span></div>
            <div className="flex gap-3"><span className="text-slate-500 w-20 shrink-0">Password</span><span className="text-teal-700 break-all">{result.password}</span></div>
          </div>
          <Btn size="sm" variant="outline" className="mt-3.5"
            onClick={()=>{
              const text = `Sarv MIS login\nName: ${f.name}\nPassword: ${result.password}`;
              if (navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast("Copy ho gaya."), ()=>toast("Copy nahi hua.", true));
              else toast("Copy nahi hua.", true);
            }}>Copy details</Btn>
        </div>
        <p className="text-[11.5px] text-slate-500 mt-3 leading-relaxed">
          Password rule: mobile number, phir @, phir DDMMYYYY janm tithi.
          Mobile ya DOB badalne par password apne aap badal jata hai.
        </p>
      </Modal>
    );
  }

  return (
    <Modal title={isEdit ? "Edit user" : "Add new user"} subtitle={isEdit ? editing.name : "नया यूज़र जोड़ें"} onClose={onClose}
      footer={<>
        <Btn variant="outline" onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" onClick={save} disabled={busy}>{busy?<Spinner/>:null}{busy?"Saving…":(isEdit?"Save changes":"Create user")}</Btn>
      </>}>
      <div className="grid sm:grid-cols-2 gap-x-3">
        <Field label="Name" hindi="नाम" required error={errs.name}>
          <input className={inputCls(errs.name)} value={f.name} onChange={e=>set("name", e.target.value)} placeholder="Ramesh Kumar" />
        </Field>
        <Field label="Mobile" hindi="मोबाइल" required error={errs.mobile}>
          <input className={inputCls(errs.mobile)} value={f.mobile} inputMode="numeric" maxLength={14}
                 onChange={e=>set("mobile", e.target.value)} placeholder="9896011223" />
        </Field>
        <Field label="Department" hindi="विभाग" required>
          <select className={inputCls(false)} value={f.department} onChange={e=>set("department", e.target.value)}>
            {DEPARTMENTS.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
        </Field>
        <Field label="Designation" hindi="पद" required error={errs.designation}>
          <input className={inputCls(errs.designation)} value={f.designation}
                 onChange={e=>set("designation", e.target.value)} placeholder="Machine Operator" />
        </Field>
        <Field label="Date of birth" hindi="जन्म तिथि" required error={errs.dob}>
          <input type="date" className={inputCls(errs.dob)} value={f.dob} max={todayStr()}
                 onChange={e=>set("dob", e.target.value)} />
        </Field>
        <Field label="Role" hindi="भूमिका" required>
          <select className={inputCls(false)} value={f.role} onChange={e=>set("role", e.target.value)}>
            {ROLES.map(r=><option key={r} value={r}>{r}</option>)}
          </select>
        </Field>
      </div>

      {f.role === "Host" && (
        <Field label="Host for which complaint types" hindi="किन शिकायतों का होस्ट" required error={errs.host_types}
               hint="Host sirf inhi types ki complaints dekh payega.">
          <div className="flex flex-wrap gap-2">
            {COMPLAINT_TYPES.map(t=>(
              <button key={t} type="button" onClick={()=>toggleType(t)}
                className={`rounded-full px-3 py-1.5 text-[12px] font-medium border transition-colors ${
                  f.host_types.includes(t)
                    ? "bg-teal-500 border-teal-500 text-slate-950"
                    : "bg-white border-slate-300 text-slate-500 hover:border-slate-400"}`}>
                {t}
              </button>
            ))}
          </div>
        </Field>
      )}
      {f.role === "Maintenance" && (
        <p className="text-[12.5px] text-slate-500 rounded-lg bg-slate-100 px-3.5 py-2.5">
          Maintenance role sabhi hosts ki complaints dekh sakta hai.
        </p>
      )}
      {f.role === "Admin" && (
        <p className="text-[12.5px] text-amber-700 rounded-lg bg-amber-500/10 px-3.5 py-2.5">
          Admin ko poora access milega — sab complaints aur user management.
        </p>
      )}

      {/* Live credential preview — the rule made visible */}
      <div className="rounded-xl border border-slate-300 bg-slate-100 p-3.5 mt-2">
        <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-2">Login banega</p>
        <div className="font-mono text-[13px] space-y-1.5">
          <div className="flex gap-3"><span className="text-slate-500 w-20 shrink-0">Name</span>
            <span className={preview.username ? "text-slate-800" : "text-slate-400"}>{preview.username || "—"}</span></div>
          <div className="flex gap-3"><span className="text-slate-500 w-20 shrink-0">Password</span>
            <span className={preview.password ? "text-teal-700" : "text-slate-400"}>{preview.password || "mobile@DDMMYYYY"}</span></div>
        </div>
      </div>
    </Modal>
  );
}

function AdminUsers({profile, toast, callAdmin}){
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState("");
  const [roleF, setRoleF] = useState("All");
  const [editing, setEditing] = useState(undefined);   // undefined = closed, null = new
  const [confirm, setConfirm] = useState(null);

  const load = useCallback(async ()=>{
    setLoading(true);
    const { data, error } = await sb.from("profiles").select("*").order("role").order("name");
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setUsers(data || []);
  },[toast]);
  useEffect(()=>{ load(); },[load]);

  const shown = useMemo(()=>{
    const n = q.trim().toLowerCase();
    return users.filter(u => {
      if (roleF !== "All" && u.role !== roleF) return false;
      if (n && ![u.name,u.mobile,u.department,u.designation].join(" ").toLowerCase().includes(n)) return false;
      return true;
    });
  },[users,q,roleF]);

  const setActive = async (u, active) => {
    const res = await callAdmin({ action:"set_active", id:u.id, is_active:active });
    if (!res.ok) return toast(res.error, true);
    toast(`${u.name} ${active ? "active" : "deactivate"} ho gaya.`);
    load();
  };
  const doDelete = async (u) => {
    const res = await callAdmin({ action:"delete", id:u.id });
    setConfirm(null);
    if (!res.ok) return toast(res.error, true);
    toast(`${u.name} delete ho gaya.`);
    load();
  };

  const roleTone = r => r==="Admin"?"rose":r==="Maintenance"?"violet":r==="Host"?"teal":"slate";

  return (
    <div>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <div>
          <h2 className="font-bold text-[17px]">User Management</h2>
          <p className="text-[12.5px] text-slate-500">यूज़र प्रबंधन &mdash; admin only</p>
        </div>
        <Btn variant="primary" icon={I.plus} className="ml-auto" onClick={()=>setEditing(null)}>Add user</Btn>
      </div>

      <div className="flex gap-2 mb-3 flex-wrap">
        <div className="relative grow min-w-[180px]">
          <Ico d={I.search} className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input className={inputCls(false)+" pl-9"} value={q} onChange={e=>setQ(e.target.value)} placeholder="Search naam, mobile, department…" />
        </div>
        <select className={inputCls(false)+" w-auto"} value={roleF} onChange={e=>setRoleF(e.target.value)}>
          <option value="All">All roles</option>
          {ROLES.map(r=><option key={r} value={r}>{r}</option>)}
        </select>
        <Btn variant="outline" icon={I.refresh} onClick={load} aria-label="Refresh" />
      </div>

      <div className="rounded-xl border border-slate-200 bg-slate-50 overflow-hidden divide-y divide-slate-200 shadow-sm">
        {loading ? Array.from({length:4}).map((_,i)=>(
          <div key={i} className="px-4 py-4"><div className="h-3 rounded bg-slate-100 animate-pulse" style={{width:`${50+i*10}%`}}/></div>
        )) : shown.length === 0 ? (
          <div className="px-5 py-14 text-center">
            <Ico d={I.users} className="w-9 h-9 mx-auto text-slate-300 mb-3" />
            <p className="font-semibold text-slate-700">Koi user nahi mila</p>
          </div>
        ) : shown.map(u => (
          <div key={u.id} className={`px-4 py-3.5 flex flex-col sm:flex-row sm:items-center gap-3 ${u.is_active?"":"opacity-55"}`}>
            <div className="w-9 h-9 rounded-full bg-slate-100 text-slate-700 grid place-items-center font-bold text-sm shrink-0">
              {u.name.slice(0,1).toUpperCase()}
            </div>
            <div className="min-w-0 sm:w-52">
              <p className="font-semibold text-[13.5px] truncate">
                {u.name}
                {u.id === profile.id ? <span className="ml-2 text-[10px] uppercase tracking-wide text-teal-600">you</span> : null}
              </p>
              <p className="text-[11.5px] text-slate-500 truncate font-mono">{u.mobile}</p>
            </div>
            <div className="min-w-0 sm:w-48">
              <p className="text-[12.5px] text-slate-700 truncate">{u.designation}</p>
              <p className="text-[11.5px] text-slate-500 truncate">{u.department}</p>
            </div>
            <div className="grow min-w-0 flex items-center gap-1.5 flex-wrap">
              <Badge tone={roleTone(u.role)}>{u.role}</Badge>
              {(u.host_types||[]).map(t => <Badge key={t} tone="slate">{t}</Badge>)}
              {!u.is_active ? <Badge tone="rose">Inactive</Badge> : null}
            </div>
            <div className="flex gap-1.5 shrink-0">
              <Btn size="sm" variant="outline" icon={I.pen} onClick={()=>setEditing(u)}>Edit</Btn>
              <Btn size="sm" variant="ghost" icon={u.is_active?I.ban:I.check}
                   onClick={()=>setActive(u, !u.is_active)}
                   disabled={u.id === profile.id}
                   title={u.is_active?"Deactivate":"Reactivate"} />
              <Btn size="sm" variant="ghost" icon={I.x} onClick={()=>setConfirm(u)}
                   disabled={u.id === profile.id} title="Delete" />
            </div>
          </div>
        ))}
      </div>

      <p className="text-[11.5px] text-slate-400 mt-3 leading-relaxed">
        Password = mobile number + <span className="text-slate-500">@</span> + DDMMYYYY (janm tithi).
        Mobile ya DOB edit karne par password apne aap badal jata hai &mdash; naya password user ko batana zaroori hai.
      </p>

      {editing !== undefined && (
        <UserFormModal editing={editing} onClose={()=>setEditing(undefined)}
                       onSaved={load} toast={toast} callAdmin={callAdmin} />
      )}
      {confirm && (
        <Modal title="Delete user?" subtitle={confirm.name} onClose={()=>setConfirm(null)}
          footer={<>
            <Btn variant="outline" onClick={()=>setConfirm(null)}>Cancel</Btn>
            <Btn variant="danger" onClick={()=>doDelete(confirm)}>Delete permanently</Btn>
          </>}>
          <p className="text-[13.5px] text-slate-700">
            <strong>{confirm.name}</strong> ka login hamesha ke liye delete ho jayega.
            Inki purani complaints register me rahengi, par reporter ka naam link nahi rahega.
          </p>
          <p className="text-[13px] text-slate-500 mt-3">
            Sirf chhutti ya transfer ke liye <em>Deactivate</em> behtar hai — data safe rehta hai.
          </p>
        </Modal>
      )}
    </div>
  );
}

// ============================================================
// 13. STATS STRIP
// ============================================================
function Stats({rows, profile}){
  const s = useMemo(()=>{
    const open = rows.filter(r => r.status === "Pending" || r.status === "In Progress");
    const machines = new Set(open.map(r => machineLabel(r)+"|"+(r.machine_no||"")));
    const down = new Set(open.filter(isDown).map(r => machineLabel(r)+"|"+(r.machine_no||"")));
    const awaiting = rows.filter(r => r.status === "Completed" &&
      (profile.role === "User" ? r.raised_by_user_id === profile.id : true)).length;
    return [
      { n: rows.filter(r=>r.status==="Pending").length, l:"Pending", c:"text-amber-600" },
      { n: rows.filter(r=>r.status==="In Progress").length, l:"In-progress", c:"text-teal-600" },
      { n: awaiting, l: profile.role==="User" ? "Aapka OK chahiye" : "Awaiting user OK", c:"text-violet-600" },
      { n: down.size, l:"Machines down", c:"text-rose-600" },
      { n: machines.size, l:"Machines affected", c:"text-slate-800" },
    ];
  },[rows, profile]);
  return (
    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-5">
      {s.map(t=>(
        <div key={t.l} className="rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-3 shadow-sm">
          <p className={`font-mono font-semibold text-2xl leading-none ${t.c}`}>{t.n}</p>
          <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mt-1.5">{t.l}</p>
        </div>
      ))}
    </div>
  );
}

// ============================================================
// 14. APP
// ============================================================
function App(){
  const [session, setSession] = useState(undefined);   // undefined = still checking
  const [profile, setProfile] = useState(null);
  const [profileErr, setProfileErr] = useState("");
  const [rows, setRows] = useState([]);
  const [machines, setMachines] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("complaints");
  const [detail, setDetail] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [toasts, setToasts] = useState([]);

  const toastSeq = useRef(0);
  const toast = useCallback((msg, bad=false)=>{
    const id = ++toastSeq.current;
    setToasts(t => [...t, {id,msg,bad}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 4200);
  },[]);
  const dismiss = useCallback(id => setToasts(t=>t.filter(x=>x.id!==id)),[]);

  // ---- auth ----
  useEffect(()=>{
    sb.auth.getSession().then(({data}) => setSession(data.session ?? null));
    const { data:{ subscription } } = sb.auth.onAuthStateChange((_e, s) => {
      setSession(s ?? null);
      if (!s){
        // Tear down EVERY view holding data. An open complaint modal that
        // survives sign-out would show the previous user's complaint to
        // whoever signs in next on the same shared factory phone.
        setProfile(null); setRows([]); setMachines([]);
        setView("complaints"); setDetail(null); setShowNew(false); setLightbox(null);
        setToasts([]);   // old toasts can name the previous user's complaints
      }
    });
    return ()=> subscription.unsubscribe();
  },[]);

  // ---- profile ----
  useEffect(()=>{
    if (!session){ setProfile(null); return; }
    let alive = true;
    sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle()
      .then(({data,error}) => {
        if (!alive) return;
        if (error) return setProfileErr(friendlyError(error));
        if (!data){ setProfileErr("Aapka profile nahi mila. Admin se sampark karein."); return; }
        if (!data.is_active){ setProfileErr("Aapka account band hai. Admin se sampark karein."); sb.auth.signOut(); return; }
        setProfile(data); setProfileErr("");
      });
    return ()=>{ alive = false; };
  },[session]);

  // ---- data ----
  const loadRows = useCallback(async (showSpinner)=>{
    if (showSpinner) setLoading(true);
    // RLS decides what comes back — no role filtering is done here on purpose.
    const { data, error } = await sb.from("machine_complaints")
      .select("*, photo_count:complaint_photos(count)")
      .order("problem_date", {ascending:false}).order("created_at", {ascending:false});
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setRows((data||[]).map(r => ({...r, photo_count: r.photo_count?.[0]?.count ?? 0})));
  },[toast]);

  useEffect(()=>{
    if (!profile) return;
    loadRows(true);
    sb.from("machine_list").select("machine_name,machine_no,department").eq("is_active",true)
      .order("department").order("machine_name").order("machine_no")
      .then(({data}) => setMachines(data||[]));
    const iv = setInterval(()=>{
      if (document.visibilityState === "visible" && !detail && !showNew) loadRows(false);
    }, 60000);
    return ()=> clearInterval(iv);
  },[profile, loadRows]);   // eslint-disable-line

  // Keep the open detail in sync with refreshed data
  useEffect(()=>{
    if (!detail) return;
    const fresh = rows.find(r => r.id === detail.id);
    if (fresh && fresh.updated_at !== detail.updated_at) setDetail(fresh);
  },[rows]);   // eslint-disable-line

  // ---- admin edge function ----
  const callAdmin = useCallback(async (payload)=>{
    try{
      const { data:{ session:s } } = await sb.auth.getSession();
      if (!s) return { ok:false, error:"Session khatam ho gaya. Dobara login karein." };
      const r = await fetch(ADMIN_FN_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${s.access_token}`, "apikey": SUPABASE_ANON },
        body: JSON.stringify(payload),
      });
      const j = await r.json().catch(()=>({}));
      if (!r.ok) return { ok:false, error: j.error || `Server error (${r.status}).` };
      return j;
    } catch(e){ return { ok:false, error: friendlyError(e) }; }
  },[]);

  // ---- render ----
  if (session === undefined) return null;      // boot overlay is still showing
  if (!session) return <><LoginScreen toast={toast} /><Toasts items={toasts} dismiss={dismiss} /></>;

  if (profileErr) return (
    <div className="min-h-screen grid place-items-center p-6 text-center">
      <div>
        <Ico d={I.alert} className="w-10 h-10 mx-auto text-rose-600 mb-3" />
        <p className="font-semibold">{profileErr}</p>
        <Btn variant="outline" className="mt-4" onClick={()=>sb.auth.signOut()}>Logout</Btn>
      </div>
    </div>
  );
  if (!profile) return <div className="min-h-screen grid place-items-center"><Spinner className="w-7 h-7 text-teal-600" /></div>;

  const scopeLine =
    profile.role === "Admin" ? "Sab complaints" :
    profile.role === "Maintenance" ? "Sab hosts ki complaints" :
    profile.role === "Host" ? `${(profile.host_types||[]).join(", ")} complaints` :
    "Sirf aapki complaints";

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap">
          <div className="w-9 h-9 rounded-lg bg-teal-500 text-slate-950 grid place-items-center font-extrabold text-[13px] shrink-0">MC</div>
          <div className="min-w-0 mr-auto">
            <h1 className="font-bold text-[15px] leading-tight truncate">Machine Complaint Register</h1>
            <p className="text-[11.5px] text-slate-500 truncate">{profile.name} · {profile.role} · {scopeLine}</p>
          </div>
          {profile.role === "Admin" && (
            <div className="flex rounded-lg border border-slate-200 overflow-hidden shrink-0">
              <button onClick={()=>setView("complaints")}
                className={`px-3 py-2 text-[12.5px] font-medium ${view==="complaints"?"bg-slate-100 text-slate-900":"text-slate-500 hover:text-slate-800"}`}>
                Complaints
              </button>
              <button onClick={()=>setView("users")}
                className={`px-3 py-2 text-[12.5px] font-medium ${view==="users"?"bg-slate-100 text-slate-900":"text-slate-500 hover:text-slate-800"}`}>
                Users
              </button>
            </div>
          )}
          <Btn variant="primary" icon={I.plus} onClick={()=>setShowNew(true)} className="shrink-0">
            <span className="hidden sm:inline">New Complaint</span><span className="sm:hidden">New</span>
          </Btn>
          <Btn variant="ghost" icon={I.logout} onClick={()=>sb.auth.signOut()} aria-label="Logout" className="shrink-0" />
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-5">
        {view === "users" && profile.role === "Admin"
          ? <AdminUsers profile={profile} toast={toast} callAdmin={callAdmin} />
          : <>
              <Stats rows={rows} profile={profile} />
              <ComplaintsView profile={profile} rows={rows} loading={loading}
                onRefresh={()=>loadRows(true)} onOpen={setDetail} toast={toast} />
            </>}
      </main>

      {showNew && (
        <NewComplaintModal profile={profile} machines={machines} toast={toast} onView={setLightbox}
          onClose={()=>setShowNew(false)} onSaved={()=>{ setShowNew(false); loadRows(false); }} />
      )}
      {detail && (
        <ComplaintDetail complaint={detail} profile={profile} toast={toast} onView={setLightbox}
          onClose={()=>setDetail(null)} onSaved={()=>{ setDetail(null); loadRows(false); }} />
      )}
      {lightbox && <Lightbox src={lightbox} onClose={()=>setLightbox(null)} />}
      <Toasts items={toasts} dismiss={dismiss} />
    </div>
  );
}

// ============================================================
// 15. MOUNT
// ============================================================
const boot = document.getElementById("boot");
if (boot) boot.remove();
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
